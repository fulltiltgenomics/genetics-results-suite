# datasets.yaml — single source of truth for dataset and resource definitions
# See docs/datasets-yaml-schema.md for field documentation.

# ---------------------------------------------------------------------------
# Resources: profile-independent metadata for data sources
# Used by db-api to build _RESOURCE_METADATA for agent-facing /schema endpoint
# ---------------------------------------------------------------------------
resources:
  finngen:
    label: "FinnGen"
    description: "FinnGen study — GWAS, eQTL, pQTL, caQTL results from Finnish biobank data"
    aliases: ["FinnGen"]

  finngen_ukbb:
    label: "FinnGen+UKB"
    description: "FinnGen + UK Biobank GWAS and pQTL meta-analysis"
    aliases: ["finngen ukbb", "finngen uk biobank"]

  finngen_mvp_ukbb:
    label: "FinnGen+MVP+UKB"
    description: "FinnGen + Million Veteran Program + UK Biobank GWAS meta-analysis"
    aliases: ["finngen mvp", "finngen mvp ukbb"]

  open_targets:
    label: "Open Targets Genetics"
    description: "Open Targets GWAS summary statistics and fine-mapping"
    aliases: ["open targets", "OT", "OTG"]

  ukbb:
    label: "UK Biobank"
    description: "UK Biobank pQTL and GWAS results"
    aliases: ["uk biobank", "UKB", "UKBB"]

  bipex2:
    label: "BipEx2"
    description: "Bipolar Exome Sequencing study v2 — gene burden results for bipolar disorder"
    aliases: ["bipex", "BipEx", "bipolar exome"]

  schema2:
    label: "SCHEMA2"
    description: "Schizophrenia Exome Meta-analysis v2 — gene burden results for schizophrenia"
    aliases: ["schema", "SCHEMA", "schizophrenia exome"]

  genebass:
    label: "Genebass"
    description: "Gene burden results and EWAS exome variant results from UK Biobank"
    aliases: ["gene bass", "uk biobank exome", "UKB exome"]

  ibd_gwas:
    label: "IBD GWAS"
    description: "IBD (inflammatory bowel disease) GWAS meta-analysis (European, East Asian, South Asian)"
    aliases: ["IBD GWAS", "IIBDGC"]

  ibd_exome_2026:
    label: "IBD Exome 2026"
    description: "IBD (inflammatory bowel disease) exome sequencing project gene burden and variant analysis"
    aliases: ["ibd exome", "IBD"]

  finnliver:
    label: "FinnLiver"
    description: "FinnLiver liver eQTL study"
    aliases: ["finn liver", "liver eQTL"]

  generisk:
    label: "GeneRisk"
    description: "GeneRisk metabolome GWAS study"
    aliases: []

  interval:
    label: "INTERVAL"
    description: "INTERVAL pQTL study"
    aliases: []

  # collection resource
  eqtl_catalogue:
    label: "eQTL Catalogue"
    description: >-
      eQTL Catalogue datasets — hundreds of tissue/cell-type QTL studies.
      Dataset IDs follow the pattern QTDNNNNNN (e.g. QTD000001).
      Use the list_datasets tool to browse available eQTL Catalogue datasets.
    aliases: []
    collection: true
    collection_id_prefix: "qtd"
    collection_data_types: ["eQTL", "sQTL"]

  # resources not in db _RESOURCE_METADATA but referenced by API datasets
  ukbb_finucane:
    label: "UKB Finucane"
    description: "UK Biobank GWAS of 119 traits (Kanai et al. 2021)"
    aliases: []

  finngen_nmr:
    label: "FinnGen NMR"
    description: "FinnGen Nightingale NMR metabolomics QTLs"
    aliases: ["finngen nmr", "NMR"]

  gtex:
    label: "GTEx"
    description: "Genotype-Tissue Expression project — gene expression across human tissues"
    aliases: ["GTEx"]

  hpa:
    label: "Human Protein Atlas"
    description: "Human Protein Atlas protein expression across tissues and cell types"
    aliases: ["HPA"]

  gencc:
    label: "GenCC"
    description: "Gene Curation Coalition gene-disease validity classifications"
    aliases: ["GenCC"]

  monarch:
    label: "Monarch Initiative"
    description: "Monarch Initiative causal gene-to-disease associations"
    aliases: ["Monarch"]

  covid_hgi:
    label: "COVID-19 HGI"
    description: "COVID-19 Host Genetics Initiative GWAS"
    aliases: ["COVID-19 HGI", "COVID HGI", "covid"]

  pgc:
    label: "PGC"
    description: "Psychiatric Genomics Consortium GWAS studies"
    aliases: ["PGC"]

  gp2:
    label: "GP2"
    description: "GP2 (Global Parkinson's Genetics Program) European ancestry GWAS"
    aliases: ["GP2", "Parkinsons", "Parkinson's disease"]

  decode:
    label: "deCODE"
    description: "deCODE Genetics — allele-specific methylation QTL (ASM-QTL) results"
    aliases: ["deCODE", "decode genetics"]

  # open-chromatin (scATAC / epigenome) + variant-effect prediction resources
  marderstein:
    label: "Marderstein/FLARE (neuro-variants)"
    description: >-
      Marderstein, Kundu, Kundaje & Montgomery 2026 (Nature Genetics) — fetal and adult
      brain and heart scATAC/snATAC peak atlas plus ChromBPNet and FLARE in-silico
      variant-effect scores on chromatin accessibility.
    aliases: ["neuro-variants", "neuro variants", "FLARE", "ChromBPNet"]

  li_brain_atac:
    label: "Li 2023 brain scATAC atlas"
    description: >-
      Li et al. 2023 (Science) human brain single-cell ATAC-seq atlas — 1.1M cells across
      42 brain regions, with candidate cis-regulatory elements (cCREs) and cCRE-to-gene links.
    aliases: ["Li brain", "Li 2023 brain"]

  catlas:
    label: "Catlas (Zhang 2021)"
    description: >-
      Zhang et al. 2021 (Cell) "Catlas" adult body-wide single-cell ATAC-seq atlas —
      30 tissues, 222 cell types, ~1.15M candidate cis-regulatory elements (cCREs).
    aliases: ["Catlas", "Zhang 2021"]

  epimap:
    label: "EpiMap"
    description: >-
      Boix et al. 2021 (Nature) EpiMap — 18-state ChromHMM active regulatory states and
      activity-based enhancer-to-gene links across 833 bulk biosamples (hg38). Not the raw
      Meuleman DHS layer.
    aliases: ["EpiMap", "Boix 2021", "ChromHMM"]

  calderon_immune:
    label: "Calderon immune (2019)"
    description: >-
      Calderon et al. 2019 (Nature Genetics) stimulation-responsive immune chromatin —
      ~32 immune cell populations in resting and stimulated states.
    aliases: ["Calderon", "Calderon 2019", "immune stimulation"]

  rosmap_brain:
    label: "ROSMAP AD brain (Xiong 2023)"
    description: >-
      Xiong et al. 2023 (Cell) ROSMAP Alzheimer's disease epigenome — aged prefrontal cortex
      snATAC (~850k nuclei, 92 donors, AD and control), cell-type peaks and peak-to-gene links.
    aliases: ["ROSMAP", "Xiong 2023", "AD brain"]

  # massively parallel reporter assay (measured cis-regulatory allelic activity)
  siraj_mpra:
    label: "Siraj MPRA"
    description: >-
      Siraj et al. 2026 massively parallel reporter assay (MPRA) — 221K fine-mapped +
      86K control variants tested in 5 cell lines (K562 blood/myeloid, HepG2 liver,
      SK-N-SH brain, HCT116 colon, A549 lung). Measures intrinsic cis-regulatory allelic
      activity (emVars) as a functional-validation layer whose emVar rate and
      allelic-effect concordance scale with FinnGen fine-mapping PIP; distinct from
      in-silico variant_effect predictions and from endogenous eQTL/caQTL.
    aliases: ["MPRA", "Siraj", "reporter assay"]

# ---------------------------------------------------------------------------
# Tables: profile-independent BigQuery view metadata
# Used by db-api for _TABLE_DESCRIPTIONS, _COLUMN_DESCRIPTIONS,
# _TABLE_EXAMPLES, _CATEGORICAL_COLUMNS, and by the sandbox schema-doc generator.
#
# `exposed: true` is what makes a table reachable through db-api's /query, /schema and
# /tables/{name}/sample. It is a separate decision from documenting one: an entry without
# the key is documented everywhere but reachable nowhere, so an allow-list cannot grow by
# someone adding a table here or forgetting a field.
#
# `resource_derivation` and `dataset_cross_check` are the other two per-table decisions that
# live here rather than as hand-kept lists in genetics-results-db's scripts: how a view's
# `resource` column is produced, and why a view contributes no `dataset` values to the
# registry cross-check. Each carries its own reason, and neither is derivable from the other
# or from `exposed` — see docs/datasets-yaml-schema.md.
# ---------------------------------------------------------------------------
tables:
  credible_sets_v:
    exposed: true
    resource_derivation:
      mode: load_time
      reason: >-
        `resource` is a clustering key on the base table and a view-derived column prunes
        nothing, so load_data.py applies the rules at load time and stores the value; there
        is no CASE in the view SQL to lint, and a rule change reaches the data only through
        a reload or backfill
    description: >-
      Fine-mapped credible sets with variant-level posterior inclusion probabilities (PIP).
      Contains GWAS, eQTL, pQTL, sQTL, caQTL results across multiple resources.
      NOTE ON caQTL: for data_type = 'caQTL' the trait is a chromatin ACCESSIBILITY PEAK
      (e.g. chr5-35863122-35863905), never a gene symbol, so a gene-based caQTL question
      is NOT answerable from this table alone. Join peak_to_gene_v on
      peak_id = trait (and cell_type = cell_type for the cell-type-matched answer) to get
      the genes each peak is linked to — see the peak_to_gene_v examples. Do NOT approximate
      the link by comparing peak and gene coordinates: linked peaks sit up to ~1 Mb from the
      gene and most peaks near a gene are not linked to it.

    columns:
      dataset: "Specific study/release name within a resource (e.g. FinnGen_R13, BipEx2)"
      data_type: "Type of association: GWAS, eQTL, pQTL, sQTL, caQTL, or metaboQTL"
      trait: "Trait/phenotype name. For caQTL this is the peak id (chr-start-end), not a gene — join peak_to_gene_v to reach genes"
      trait_original: "Original trait name in the respective dataset, e.g. phenotype code"
      cell_type: "Cell type or tissue context (for QTL data)"
      chr: "Chromosome number"
      pos: "Genomic position (GRCh38)"
      ref: "Reference allele"
      alt: "Alternative (effect) allele"
      mlog10p: "-log10(p-value). Higher = more significant. 7.30103 = genome-wide significance (p-value 5e-8)"
      beta: "Effect size estimate (log-OR for binary traits)"
      se: "Standard error of beta"
      pip: "Posterior inclusion probability from fine-mapping (0-1). Higher = more likely causal"
      cs_id: >-
        Credible set identifier — groups variants in the same causal signal. NOT unique on
        its own: the same cs_id value recurs across resources, datasets, traits and cell
        types, so a credible set is identified by
        (resource, dataset, trait, cell_type, cs_id) — the grouping the
        one-row-per-credible-set example below uses. GROUP BY, PARTITION BY or COUNT on
        cs_id alone silently merges unrelated signals. In a JOIN the same five columns need
        a NULL-safe comparison on cell_type (cell_type IS NOT DISTINCT FROM ..., never =):
        cell_type is NULL on every GWAS row — 282,195 of 2,489,585 rows on chr22 — so a
        plain equi-join on the key drops all of them. The key is not strictly one row per
        variant either: about 2.4% of credible sets (2,975 of 122,322 on chr22) repeat a
        variant, so COUNT(*) per key can exceed cs_size; use COUNT(DISTINCT variant) when
        the count has to match.
      cs_size: "Number of variants in this credible set"
      cs_min_r2: "Minimum pairwise LD r² within the credible set"
      aaf: "Alternative allele frequency. Prefer maf column for minor allele frequency"
      most_severe: "Most severe VEP-predicted variant consequence"
      gene_most_severe: "Gene symbol associated with the most severe consequence"
      variant: "Variant identifier as chr:pos:ref:alt, chromosome X is 23"
      maf: "Minor allele frequency = LEAST(aaf, 1-aaf). Use directly instead of computing from aaf"
      resource: "Data source identifier (lowercase). Always filter by this column, not dataset"

    column_types:
      dataset: STRING
      data_type: STRING
      trait: STRING
      trait_original: STRING
      cell_type: STRING
      chr: INT64
      pos: INT64
      ref: STRING
      alt: STRING
      mlog10p: FLOAT64
      beta: FLOAT64
      se: FLOAT64
      pip: FLOAT64
      cs_id: STRING
      cs_size: INT64
      cs_min_r2: FLOAT64
      aaf: FLOAT64
      most_severe: STRING
      gene_most_severe: STRING
      variant: STRING
      maf: FLOAT64
      resource: STRING

    examples:
      - description: "Everything a variant is fine-mapped for, across all resources and data types. Always add the chr filter next to variant — the table is partitioned by chr and without it the same query scans ~20x more data and can hit the bytes-billed limit."
        sql: |-
          SELECT resource, dataset, data_type, trait, trait_original, cell_type,
                 pip, mlog10p, beta, cs_id, cs_size, most_severe, gene_most_severe
          FROM credible_sets_v
          WHERE chr = 12 AND variant = '12:111446804:T:C'
          ORDER BY mlog10p DESC

      - description: "Find the exact trait codes before filtering on them. trait_original holds the source phenotype code (FinnGen endpoints like K11_IBD_STRICT, UKBB field codes), trait a readable name — do this lookup first instead of guessing a code."
        sql: |-
          SELECT DISTINCT dataset, trait, trait_original
          FROM credible_sets_v
          WHERE resource = 'finngen' AND data_type = 'GWAS'
            AND (LOWER(trait) LIKE '%colorectal%' OR LOWER(trait_original) LIKE '%colorectal%')
          ORDER BY trait

      - description: "Lead variant of every genome-wide significant credible set for a phenotype. Rows are variant-level, so pick the top-PIP variant per credible set rather than reporting every row. Partition by all five key columns even when trait and cell_type are pinned by the WHERE clause — the same window lifted into a broader query merges credible sets otherwise."
        sql: |-
          WITH leads AS (
            SELECT resource, dataset, trait, cell_type, cs_id, cs_size,
                   chr, pos, variant, pip, mlog10p, beta, maf,
                   most_severe, gene_most_severe,
                   ROW_NUMBER() OVER (PARTITION BY resource, dataset, trait, cell_type, cs_id
                                      ORDER BY pip DESC, mlog10p DESC) AS rn
            FROM credible_sets_v
            WHERE resource = 'finngen' AND data_type = 'GWAS' AND trait_original = 'K11_IBD_STRICT'
          )
          SELECT * EXCEPT (rn) FROM leads
          WHERE rn = 1 AND mlog10p >= 7.30103
          ORDER BY chr, pos

      - description: "All credible sets (GWAS and molecular QTL) overlapping a locus, one row per credible set"
        sql: |-
          SELECT resource, dataset, data_type, trait, trait_original, cell_type, cs_id, cs_size,
                 COUNT(*) AS n_variants, MAX(pip) AS max_pip, MAX(mlog10p) AS max_mlog10p
          FROM credible_sets_v
          WHERE chr = 1 AND pos BETWEEN 113259226 AND 114244415 AND pip > 0.01
          GROUP BY resource, dataset, data_type, trait, trait_original, cell_type, cs_id, cs_size
          ORDER BY max_mlog10p DESC

      - description: "Fine-mapped protective loss-of-function variants. Note the LoF consequence values actually present in most_severe; 'transcript_ablation' and 'transcript_ablation_variant' do not occur."
        sql: |-
          SELECT variant, gene_most_severe, most_severe, trait, trait_original,
                 pip, mlog10p, beta, maf
          FROM credible_sets_v
          WHERE resource = 'finngen' AND data_type = 'GWAS'
            AND most_severe IN ('frameshift_variant', 'stop_gained', 'stop_lost', 'start_lost',
                                'splice_acceptor_variant', 'splice_donor_variant')
            AND pip > 0.1 AND beta < 0 AND maf < 0.05
          ORDER BY pip DESC, mlog10p DESC

      - description: "Everything fine-mapped in a window around a gene. gene_most_severe only tags variants whose consequence hits that gene, so use gene coordinates from gene_annotations_v for locus-level questions. chr is INT64 in both views — no casting needed."
        sql: |-
          WITH g AS (
            SELECT chr, MIN(gene_start) AS gene_start, MAX(gene_end) AS gene_end
            FROM gene_annotations_v WHERE symbol = 'SEMA4B' GROUP BY chr
          )
          SELECT c.resource, c.dataset, c.trait, c.trait_original, c.cs_id, c.variant,
                 c.pip, c.mlog10p, c.beta, c.most_severe, c.gene_most_severe
          FROM credible_sets_v c
          JOIN g ON c.chr = g.chr AND c.pos BETWEEN g.gene_start - 200000 AND g.gene_end + 200000
          WHERE c.data_type = 'GWAS' AND c.pip > 0.1
          ORDER BY c.mlog10p DESC

      - description: "Molecular QTLs for a gene. For eQTL/pQTL/sQTL rows the measured molecule is in trait (gene or protein symbol), the context in cell_type. caQTL is NOT included here — its trait is a peak, see the next example."
        sql: |-
          SELECT resource, dataset, data_type, cell_type, variant, pip, mlog10p, beta, cs_id
          FROM credible_sets_v
          WHERE chr = 1 AND trait = 'PCSK9' AND data_type IN ('eQTL', 'pQTL', 'sQTL')
          ORDER BY mlog10p DESC

      - description: "How many caQTL associations, over how many peaks and cell types, a gene has. caQTL traits are peaks, so the gene is reached only by joining peak_to_gene_v; the literal cs.chr predicate prunes partitions and is worth adding whenever the gene's chromosome is known. Drop the cell_type equality from the join for the cell-type-agnostic, peak-level count."
        sql: |-
          SELECT COUNT(*) AS n_associations,
                 COUNT(DISTINCT cs.trait) AS n_peaks,
                 COUNT(DISTINCT cs.cell_type) AS n_cell_types
          FROM credible_sets_v cs
          JOIN peak_to_gene_v l
            ON l.peak_id = cs.trait AND l.cell_type = cs.cell_type
          WHERE cs.data_type = 'caQTL' AND l.symbol = 'IL7R' AND cs.chr = 5

    categorical_columns:
      resource: null
      dataset: "resource"
      data_type: "resource"
      most_severe: null

  colocalization_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      Colocalization analysis results (coloc.susie) between pairs of studies.
      PP_H4_abf indicates shared causal variant probability. The view is partitioned by chr,
      so add a literal chr predicate (chr = 19, not a join or a subquery) whenever the
      chromosome is known — without it the query scans every chromosome.

    columns:
      dataset1: "Study 1 dataset name"
      dataset2: "Study 2 dataset name"
      data_type1: "Study 1 association type (GWAS, eQTL, pQTL, sQTL, caQTL, metaboQTL)"
      data_type2: "Study 2 association type (GWAS, eQTL, pQTL, sQTL, caQTL, metaboQTL)"
      trait1: "Trait/phenotype name for study 1"
      trait1_original: "Original trait name for study 1, e.g. phenotype code"
      trait2: "Trait/phenotype name for study 2"
      trait2_original: "Original trait name for study 2, e.g. phenotype code"
      cell_type1: "Cell/tissue context for trait 1"
      cell_type2: "Cell/tissue context for trait 2"
      cs1_id: "Credible set ID for trait 1"
      cs2_id: "Credible set ID for trait 2"
      hit1: "Variant that coloc predicted to be the most likely causal variant in trait 1 (chr:pos:ref:alt)"
      hit2: "Variant that coloc predicted to be the most likely causal variant in trait 2 (chr:pos:ref:alt)"
      hit1_beta: "Effect size for lead variant in trait 1"
      hit1_mlog10p: "-log10(p) for lead variant in trait 1"
      hit2_beta: "Effect size for lead variant in trait 2"
      hit2_mlog10p: "-log10(p) for lead variant in trait 2"
      chr: "Chromosome number, chromosome X is 23"
      region_start_min: "Start of the analyzed region (GRCh38)"
      region_end_max: "End of the analyzed region (GRCh38)"
      PP_H0_abf: "Posterior probability neither trait has association in the region"
      PP_H1_abf: "Posterior probability only trait 1 has association"
      PP_H2_abf: "Posterior probability only trait 2 has association"
      PP_H3_abf: "Posterior probability both traits associate via DIFFERENT causal variants"
      PP_H4_abf: "Posterior probability both traits associate and share the SAME causal variant. Generally >0.8 suggests colocalization"
      nsnps: "Number of SNPs in the region in both credible sets"
      nsnps1: "SNPs in the region for trait 1"
      nsnps2: "SNPs in the region for trait 2"
      cs1_log10bf: "log10 Bayes factor for credible set 1"
      cs2_log10bf: "log10 Bayes factor for credible set 2"
      clpp: "Causal posterior probability"
      clpa: "Causal posterior agreement"
      cs1_size: "Number of variants in credible set 1"
      cs2_size: "Number of variants in credible set 2"
      cs_overlap: "Number of variants shared between both credible sets"
      topInOverlap: "Whether the maximum PIP variant was in overlap of regions or not, for both traits, e.g. 1,1 or 0,0"
      resource1: "Data source for study 1 (lowercase)"
      resource2: "Data source for study 2 (lowercase)"

    column_types:
      dataset1: STRING
      dataset2: STRING
      data_type1: STRING
      data_type2: STRING
      trait1: STRING
      trait1_original: STRING
      trait2: STRING
      trait2_original: STRING
      cell_type1: STRING
      cell_type2: STRING
      cs1_id: STRING
      cs2_id: STRING
      hit1: STRING
      hit2: STRING
      hit1_beta: FLOAT64
      hit1_mlog10p: FLOAT64
      hit2_beta: FLOAT64
      hit2_mlog10p: FLOAT64
      chr: INT64
      region_start_min: INT64
      region_end_max: INT64
      PP_H0_abf: FLOAT64
      PP_H1_abf: FLOAT64
      PP_H2_abf: FLOAT64
      PP_H3_abf: FLOAT64
      PP_H4_abf: FLOAT64
      nsnps: INT64
      nsnps1: INT64
      nsnps2: INT64
      cs1_log10bf: FLOAT64
      cs2_log10bf: FLOAT64
      clpp: FLOAT64
      clpa: FLOAT64
      cs1_size: INT64
      cs2_size: INT64
      cs_overlap: INT64
      topInOverlap: STRING
      resource1: STRING
      resource2: STRING

    examples:
      - description: "What molecular QTLs colocalize with a GWAS phenotype — the usual 'what is the likely mechanism' query"
        sql: |-
          SELECT trait1, trait1_original, resource2, dataset2, data_type2, trait2, cell_type2,
                 PP_H4_abf, clpp, hit1, hit2, hit1_beta, hit2_beta, cs1_id, cs2_id
          FROM colocalization_v
          WHERE resource1 = 'finngen' AND trait1_original = 'K11_IBD_STRICT'
            AND data_type2 IN ('eQTL', 'pQTL', 'sQTL', 'caQTL')
            AND PP_H4_abf > 0.8
          ORDER BY PP_H4_abf DESC

      - description: "Everything colocalizing at a locus. There is no single position column — a colocalization covers the region [region_start_min, region_end_max], so test region overlap rather than pos BETWEEN."
        sql: |-
          SELECT resource1, dataset1, data_type1, trait1, trait1_original,
                 resource2, dataset2, data_type2, trait2, cell_type2,
                 PP_H4_abf, PP_H3_abf, hit1, hit2, cs_overlap, cs1_id, cs2_id
          FROM colocalization_v
          WHERE chr = 19 AND region_start_min < 8500000 AND region_end_max > 8300000
            AND PP_H4_abf > 0.5
          ORDER BY PP_H4_abf DESC

      - description: "All colocalizations involving one trait. Pairs are not ordered, so a gene or phenotype can appear as either side — always test trait1 OR trait2, otherwise half the hits are missed."
        sql: |-
          SELECT data_type1, dataset1, trait1, cell_type1, data_type2, dataset2, trait2, cell_type2,
                 PP_H4_abf, hit1, hit2, hit1_mlog10p, hit2_mlog10p
          FROM colocalization_v
          WHERE (trait1 = 'PCSK9' OR trait2 = 'PCSK9') AND PP_H4_abf > 0.8
          ORDER BY PP_H4_abf DESC

      - description: "Phenotypes sharing causal variants with a GWAS trait, with effect direction concordance from the lead variant betas"
        sql: |-
          SELECT trait2_original, resource2, COUNT(DISTINCT cs1_id) AS n_loci,
                 ROUND(MAX(PP_H4_abf), 3) AS max_pp_h4,
                 COUNTIF(SIGN(hit1_beta) = SIGN(hit2_beta)) AS n_same_direction,
                 COUNTIF(SIGN(hit1_beta) != SIGN(hit2_beta)) AS n_opposite_direction
          FROM colocalization_v
          WHERE resource1 = 'finngen' AND trait1_original = 'K11_IBD_STRICT'
            AND data_type1 = 'GWAS' AND data_type2 = 'GWAS' AND PP_H4_abf > 0.8
          GROUP BY trait2_original, resource2
          ORDER BY n_loci DESC

    categorical_columns:
      resource1: null
      resource2: null
      dataset1: "resource1"
      dataset2: "resource2"
      data_type1: "resource1"
      data_type2: "resource2"

  coloc_credsets_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      Individual credible set variants in colocalized credible sets. Partitioned by chr, so
      add a literal chr predicate whenever the chromosome is known.

      JOINING TO colocalization_v: (dataset, cs_id) is NOT a key. cs_id names the fine-mapped
      REGION, not the trait, so one (dataset, cs_id) pair spans many traits — UKB_PPP
      chr22:42428847-45428847_1 covers 71 distinct proteins, FinnGen_kanta
      chr22:35566896-38566896_1 covers 15. A join on (cs_id, dataset) alone therefore pulls
      in unrelated traits' credible sets and mixes their PIPs into the answer with no error.
      Match the trait and the cell type as well:
      cc.cs_id = t.cs1_id AND cc.dataset = t.dataset1 AND cc.trait_original =
      t.trait1_original AND cc.cell_type IS NOT DISTINCT FROM t.cell_type1, and symmetrically
      with cs2_id / dataset2 / trait2_original / cell_type2.

      Two things about that join are easy to get wrong. Match on trait_original, NOT on
      trait: for eQTL and sQTL, colocalization_v.trait2 is a gene symbol while this view's
      trait is the molecular feature id, so cc.trait = t.trait2 drops about 94% of eQTL and
      99% of sQTL sides outright. And compare cell_type with IS NOT DISTINCT FROM rather
      than =, because cell_type is NULL on every GWAS row and a plain equi-join drops all of
      them. Residual, and it runs the opposite way to what you might expect: for a few
      datasets THIS view's trait_original carries a quantification-method suffix
      (ENSG00000100147|ge, ...|exon, ...|txrev) that colocalization_v's trait_original
      omits, so the exact match returns nothing for them. On chr22 that is every FinnLiver
      side and only FinnLiver — 24 of 4,466 eQTL and 4 of 473 sQTL sides. Comparing the
      bare id on both sides recovers all of them and over-matches nothing (4,466/4,466
      eQTL, 473/473 sQTL on chr22, no side matching more than one credible set), so when a
      side comes back empty retry with
      SPLIT(cc.trait_original, '|')[OFFSET(0)] = SPLIT(t.trait2_original, '|')[OFFSET(0)]
      before concluding the credible set is missing.

      DUPLICATE ROWS: (dataset, cs_id, trait_original, cell_type, variant) is not unique
      here — 4,443 of 20,050 keys on chr22 (22%) repeat at least one variant, and the
      repeats are byte-identical, never more than twice (933,918 rows on chr22 collapse to
      773,068 distinct key+variant pairs). Use SELECT DISTINCT, or COUNT(DISTINCT variant),
      for anything per-variant; intersecting the two sides of a colocalization joins this
      view to itself and inflates up to 4x.

    columns:
      dataset: "Study/release name"
      data_type: "Association type (GWAS, eQTL, pQTL, etc.)"
      trait: "Trait/phenotype name"
      trait_original: "Original trait name in the respective dataset, e.g. phenotype code"
      cell_type: "Cell/tissue context"
      chr: "Chromosome number, chromosome X is 23"
      pos: "Genomic position (GRCh38)"
      ref: "Reference allele"
      alt: "Alternative (effect) allele"
      mlog10p: "-log10(p-value)"
      beta: "Effect size estimate (log-OR for binary traits)"
      se: "Standard error of beta"
      pip: "Posterior inclusion probability from fine-mapping (0-1). Higher = more likely causal"
      cs_id: >-
        Credible set identifier. Matches cs1_id/cs2_id in colocalization_v, but only as part
        of (dataset, trait_original, cell_type, cs_id): the same cs_id occurs in many
        datasets and, because it names the fine-mapped region rather than the trait, under
        many traits within one dataset. See the join rule in this view's description.
      variant: "Variant identifier as chr:pos:ref:alt"
      resource: "Data source identifier (lowercase)"

    column_types:
      dataset: STRING
      data_type: STRING
      trait: STRING
      trait_original: STRING
      cell_type: STRING
      chr: INT64
      pos: INT64
      ref: STRING
      alt: STRING
      mlog10p: FLOAT64
      beta: FLOAT64
      se: FLOAT64
      pip: FLOAT64
      cs_id: STRING
      variant: STRING
      resource: STRING

    examples:
      - description: "Both credible sets behind a colocalization. Carry trait_original and cell_type through the CTE and into the join — (dataset, cs_id) alone matches every other trait fine-mapped in the same region: on the pair this query picks it returns 18 credible sets and 18 rows instead of the 2 and 2 below. SELECT DISTINCT because this view repeats rows. PP_H4_abf ties (many pairs sit at exactly 1.0), so the ORDER BY names further columns to make the pick reproducible."
        sql: |-
          WITH top_coloc AS (
            SELECT dataset1, cs1_id, trait1_original, cell_type1,
                   dataset2, cs2_id, trait2_original, cell_type2
            FROM colocalization_v
            WHERE resource1 = 'finngen' AND trait1_original = 'K11_IBD_STRICT'
              AND data_type2 = 'eQTL' AND PP_H4_abf > 0.9
            ORDER BY PP_H4_abf DESC, dataset2, trait2_original, cs2_id LIMIT 1
          )
          SELECT DISTINCT cc.dataset, cc.data_type, cc.trait, cc.trait_original, cc.cell_type,
                 cc.variant, cc.pip, cc.mlog10p, cc.beta
          FROM top_coloc t
          JOIN coloc_credsets_v cc
            ON (cc.cs_id = t.cs1_id AND cc.dataset = t.dataset1
                AND cc.trait_original = t.trait1_original
                AND cc.cell_type IS NOT DISTINCT FROM t.cell_type1)
            OR (cc.cs_id = t.cs2_id AND cc.dataset = t.dataset2
                AND cc.trait_original = t.trait2_original
                AND cc.cell_type IS NOT DISTINCT FROM t.cell_type2)
          ORDER BY cc.data_type, cc.pip DESC

      - description: "Variants shared by both credible sets of a colocalization, with each side's PIP and effect direction (candidate causal variants). Each side is pinned by dataset, trait_original, cell_type and cs_id; drop any of them and the intersection is taken against the wrong credible set. SELECT DISTINCT is required, not cosmetic: this view repeats rows and the self-join squares that — on the pair below 4 rows collapse to the 1 real shared variant. The ORDER BY in the CTE breaks PP_H4_abf ties so the pair is reproducible."
        sql: |-
          WITH pair AS (
            SELECT dataset1, cs1_id, trait1_original, cell_type1,
                   dataset2, cs2_id, trait2_original, cell_type2
            FROM colocalization_v
            WHERE resource1 = 'finngen' AND trait1_original = 'K11_IBD_STRICT'
              AND data_type2 = 'eQTL' AND PP_H4_abf > 0.9 AND cs_overlap > 0
            ORDER BY PP_H4_abf DESC, dataset2, trait2_original, cs2_id LIMIT 1
          )
          SELECT DISTINCT a.variant, a.pip AS gwas_pip, b.pip AS qtl_pip,
                 a.beta AS gwas_beta, b.beta AS qtl_beta
          FROM pair p
          JOIN coloc_credsets_v a
            ON a.cs_id = p.cs1_id AND a.dataset = p.dataset1
           AND a.trait_original = p.trait1_original
           AND a.cell_type IS NOT DISTINCT FROM p.cell_type1
          JOIN coloc_credsets_v b
            ON b.cs_id = p.cs2_id AND b.dataset = p.dataset2
           AND b.trait_original = p.trait2_original
           AND b.cell_type IS NOT DISTINCT FROM p.cell_type2
           AND b.variant = a.variant
          ORDER BY a.pip DESC

    categorical_columns:
      resource: null
      dataset: "resource"
      data_type: "resource"

  exome_variant_results_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      Single-variant exome association results from multiple resources with different
      significance thresholds. Genebass contains variants filtered to p < 1e-4.
      IBD exome (ibd_exome_2026) contains variants filtered to mlog10p > 4.

    columns:
      dataset: "Study name (e.g. genebass, IBD_exome)"
      chr: "Chromosome number, chromosome X is 23"
      pos: "Genomic position (GRCh38)"
      ref: "Reference allele"
      alt: "Alternative (effect) allele"
      gene: "Gene symbol (e.g. PCSK9)"
      annotation: "Variant annotation filter (e.g. pLoF, missense, synonymous, splice_region_variant)"
      mlog10p: "-log10(p-value) for the single-variant association. Higher = more significant"
      beta: "Effect size estimate (log-OR for binary traits)"
      se: "Standard error of beta"
      af_overall: "Overall alternative allele frequency"
      af_cases: "Alternative allele frequency in cases"
      af_controls: "Alternative allele frequency in controls"
      ac: "Alternative allele count"
      an: "Alternative allele number (total alleles genotyped)"
      n_cases: "Number of cases in the analysis (may be NA)"
      n_controls: "Number of controls in the analysis (may be NA)"
      trait: "Trait/phenotype name"
      trait_original: "Original trait name in the respective dataset"
      variant: "Variant identifier as chr:pos:ref:alt"
      resource: "Data source identifier (lowercase)"

    column_types:
      dataset: STRING
      chr: INT64
      pos: INT64
      ref: STRING
      alt: STRING
      gene: STRING
      annotation: STRING
      mlog10p: FLOAT64
      beta: FLOAT64
      se: FLOAT64
      af_overall: FLOAT64
      af_cases: FLOAT64
      af_controls: FLOAT64
      ac: INT64
      an: INT64
      n_cases: INT64
      n_controls: INT64
      trait: STRING
      trait_original: STRING
      variant: STRING
      resource: STRING

    examples:
      - description: "Predicted loss-of-function variant associations in a gene. annotation values differ per resource: genebass uses pLoF/missense/LC, ibd_exome_2026 uses VEP terms such as frameshift_variant."
        sql: |-
          SELECT resource, dataset, trait, trait_original, gene, annotation, variant,
                 mlog10p, beta, se, af_overall, ac, an
          FROM exome_variant_results_v
          WHERE gene = 'NOD2' AND annotation = 'pLoF'
          ORDER BY mlog10p DESC

      - description: "Exome associations for one variant across resources"
        sql: |-
          SELECT resource, dataset, gene, annotation, trait, mlog10p, beta, af_overall, ac
          FROM exome_variant_results_v
          WHERE variant = '16:50729867:G:GC'
          ORDER BY mlog10p DESC

      - description: "Distinct qualifying variants in a gene with allele counts — ac/2 approximates the number of heterozygous carriers behind a burden signal"
        sql: |-
          SELECT DISTINCT gene, variant, annotation, af_overall, ac, an
          FROM exome_variant_results_v
          WHERE gene = 'TLN2' AND annotation = 'pLoF' AND resource = 'genebass'
          ORDER BY ac DESC

    categorical_columns:
      resource: null
      dataset: "resource"
      annotation: "resource"

  gene_burden_results_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      Gene-level burden test results from exome sequencing studies
      (e.g. BipEx2, SCHEMA2, Genebass, IBD exome). UNFILTERED: every gene x
      annotation x trait combination is present, so a null result for a specific
      gene in a specific trait is a real null result and not a missing row.
      Genebass alone contributes ~343M rows, so always constrain on gene and/or
      trait rather than scanning.

    columns:
      dataset: "Study name (e.g. BipEx2, SCHEMA2, genebass, IBD_exome)"
      trait: "Trait/phenotype name"
      gene: "Gene symbol (e.g. PCSK9)"
      gene_id: "Ensembl gene ID (e.g. ENSG00000169174)"
      chr: "Chromosome number, chromosome X is 23"
      gene_start_pos: "Gene start position (GRCh38)"
      gene_end_pos: "Gene end position (GRCh38)"
      annotation: "Variant annotation filter used in burden test (e.g. pLoF, nonsynonymous)"
      mlog10p_burden: "-log10(p-value) from the gene-level burden test. Higher = more significant"
      beta: "Effect size estimate from burden test"
      se: "Standard error of beta"
      total_variants: "Total qualifying variants in the gene"
      total_variants_pheno: "Qualifying variants with phenotype data"
      n_cases: "Number of cases in the analysis"
      n_controls: "Number of controls in the analysis"
      trait_original: "Original trait name in the respective dataset"
      flags: "Quality or analysis flags (NA if none)"
      resource: "Data source identifier (lowercase). Use this for filtering, not dataset"

    column_types:
      dataset: STRING
      trait: STRING
      gene: STRING
      gene_id: STRING
      chr: INT64
      gene_start_pos: INT64
      gene_end_pos: INT64
      annotation: STRING
      mlog10p_burden: FLOAT64
      beta: FLOAT64
      se: FLOAT64
      total_variants: INT64
      total_variants_pheno: INT64
      n_cases: INT64
      n_controls: INT64
      trait_original: STRING
      flags: STRING
      resource: STRING

    examples:
      - description: "All burden tests for a gene across every exome study and phenotype — the usual starting point for 'is this gene implicated anywhere'"
        sql: |-
          SELECT resource, dataset, trait, trait_original, annotation,
                 mlog10p_burden, beta, se, n_cases, n_controls, total_variants
          FROM gene_burden_results_v
          WHERE gene = 'TLN1'
          ORDER BY mlog10p_burden DESC

      - description: "pLoF burden hits for a disease. Trait names are source-specific strings, so match them case-insensitively rather than assuming an exact label."
        sql: |-
          SELECT gene, annotation, trait, mlog10p_burden, beta, se,
                 n_cases, n_controls, total_variants
          FROM gene_burden_results_v
          WHERE resource = 'genebass' AND annotation = 'pLoF'
            AND LOWER(trait) LIKE '%crohn%'
          ORDER BY mlog10p_burden DESC

      - description: "Top burden signals in a single exome study"
        sql: |-
          SELECT gene, annotation, trait, mlog10p_burden, beta, n_cases, n_controls
          FROM gene_burden_results_v
          WHERE resource = 'bipex2' AND mlog10p_burden > 3
          ORDER BY mlog10p_burden DESC LIMIT 20

      - description: "One gene's burden result in specific traits, significant or not — the table is unfiltered, so this answers 'was this gene tested and what came out'"
        sql: |-
          SELECT trait_original, annotation, mlog10p_burden, beta, se, total_variants
          FROM gene_burden_results_v
          WHERE gene = 'PCSK9'
            AND trait_original IN ('continuous_30780_both_sexes__irnt', 'icd10_E78_both_sexes__')
          ORDER BY mlog10p_burden DESC

    categorical_columns:
      resource: null
      dataset: "resource"
      annotation: "resource"

  asm_qtl_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      Allele-specific methylation QTL (ASM-QTL) results from deCODE Genetics
      (Stefansson et al. 2024, doi:10.1038/s41588-024-01851-2), based on Oxford
      Nanopore whole-genome sequencing of 7,179 Icelandic samples. Contains
      associations between sequence variants and CpG methylation rates (CpG units,
      Data-S1) or methylation depleted sequence (MDS) methylation rates (Data-S3).
      Only primary and secondary signals released (see variant_rank); Bonferroni-
      significant at ~1e-12 (CpG) and ~1e-10 (MDS), MAF > 1e-4, imputation INFO > 0.9,
      variant within 100 kb of the methylation target.

    columns:
      dataset: "Source dataset (deCODE_asmQTL_CpG, deCODE_asmQTL_MDS)"
      chr: "Chromosome number"
      pos: "Genomic position (GRCh38)"
      ref: "Reference allele"
      alt: "Alternative allele"
      rsid: "dbSNP rsID"
      beta: "Effect size (SD units) of the variant on methylation rates"
      se: "Standard error of beta"
      mlog10p: "-log10(p-value). Higher = more significant"
      af: "Allele frequency"
      most_severe: "Most severe VEP-predicted variant consequence"
      gene_most_severe: "Gene symbol associated with the most severe consequence"
      target_start: "Start position of the methylation target (CpG unit or MDS)"
      target_end: "End position of the methylation target (CpG unit or MDS)"
      ref_methylrate: "Average methylation rate on reference haplotype"
      alt_methylrate: "Average methylation rate on alternative haplotype"
      n_haplotypes: "Number of informative haplotypes used in analysis"
      variant_rank: "primary = most significant variant, secondary = most significant on major allele of primary"
      ld_count: "Number of variants in high LD (r2>0.8) with this variant"
      vartype: "Variant type (SNV, SV, etc.)"
      variant: "Variant identifier as chr:pos:ref:alt"
      maf: "Minor allele frequency = LEAST(af, 1-af)"
      resource: "Data source identifier (lowercase)"

    column_types:
      dataset: STRING
      chr: INT64
      pos: INT64
      ref: STRING
      alt: STRING
      rsid: STRING
      beta: FLOAT64
      se: FLOAT64
      mlog10p: FLOAT64
      af: FLOAT64
      most_severe: STRING
      gene_most_severe: STRING
      target_start: INT64
      target_end: INT64
      ref_methylrate: FLOAT64
      alt_methylrate: FLOAT64
      n_haplotypes: INT64
      variant_rank: STRING
      ld_count: INT64
      vartype: STRING
      variant: STRING
      maf: FLOAT64
      resource: STRING

    examples:
      - description: "ASM-QTL associations for variants near a gene"
        sql: >-
          SELECT variant, rsid, mlog10p, beta, target_start, target_end,
                 ref_methylrate, alt_methylrate, variant_rank
          FROM asm_qtl_v
          WHERE gene_most_severe = 'PCSK9'
          ORDER BY mlog10p DESC LIMIT 20

      - description: "Primary ASM-QTL associations with large methylation differences"
        sql: >-
          SELECT variant, rsid, gene_most_severe, mlog10p,
                 ref_methylrate, alt_methylrate, dataset
          FROM asm_qtl_v
          WHERE variant_rank = 'primary'
            AND ABS(ref_methylrate - alt_methylrate) > 0.2
          ORDER BY mlog10p DESC LIMIT 50

    categorical_columns:
      resource: null
      dataset: "resource"
      variant_rank: null
      vartype: null

  open_chromatin_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      Atlas of accessible/active chromatin regions (peaks) labeled by cell
      type, tissue, and condition. Region-indexed presence/annotation atlas
      (no p-values): a row means the interval is open/active chromatin in the
      given context. Query by overlapping a position or region against
      peak_start/peak_end. Always filter by resource, not dataset.

    columns:
      chr: "Chromosome number (GRCh38; X=23, Y=24, M=25)"
      peak_start: "Peak interval start (GRCh38)"
      peak_end: "Peak interval end (GRCh38)"
      peak_id: >-
        Peak identifier as chr-start-end with a BARE numeric chromosome,
        e.g. 22-20750312-20751112 (X=23). Distinct id space from
        peak_to_gene_v.peak_id, which is chr-prefixed: the two DO NOT JOIN on
        peak_id. Relate the two tables by overlapping peak_start/peak_end instead.
      dataset: "Source dataset identifier"
      cell_type: "Verbatim source cell-type/context label"
      tissue: "Harmonized tissue (e.g. brain, heart, immune)"
      life_stage: "Developmental stage (fetal, adult, unknown)"
      condition: "Experimental condition (resting, stimulated, AD, control, unknown)"
      assay: "Assay type (scATAC, snATAC, bulk_ATAC, chromHMM)"
      score: "Peak signal strength (NA for presence/ChromHMM data)"
      score_type: "Meaning of score (e.g. signal, cpm, presence, chromhmm:<State>)"
      n_cells: "Number of cells supporting the peak (single-cell assays)"
      cell_ontology_id: "Cell Ontology (CL) identifier where available"
      uberon_id: "UBERON anatomy identifier where available"
      target_gene: "Linked target gene symbol for cCRE->gene links (else NA)"
      target_gene_id: "Linked target Ensembl gene ID for cCRE->gene links (else NA)"
      version: "Data release version"
      resource: "Data source identifier (lowercase). Always filter by this column, not dataset"

    column_types:
      chr: INT64
      peak_start: INT64
      peak_end: INT64
      peak_id: STRING
      dataset: STRING
      cell_type: STRING
      tissue: STRING
      life_stage: STRING
      condition: STRING
      assay: STRING
      score: FLOAT64
      score_type: STRING
      n_cells: INT64
      cell_ontology_id: STRING
      uberon_id: STRING
      target_gene: STRING
      target_gene_id: STRING
      version: STRING
      resource: STRING

    examples:
      - description: "Cell types/tissues where a genomic position is open chromatin"
        sql: >-
          SELECT DISTINCT resource, tissue, cell_type, condition
          FROM open_chromatin_v
          WHERE chr = 1 AND peak_start <= 55039974 AND peak_end >= 55039974

      - description: "Check whether a variant's position is accessible in brain"
        sql: >-
          SELECT resource, cell_type, condition, assay, score
          FROM open_chromatin_v
          WHERE chr = 1 AND peak_start <= 55039974 AND peak_end >= 55039974
            AND tissue = 'brain'

    categorical_columns:
      resource: null
      dataset: "resource"
      tissue: "resource"
      life_stage: "resource"
      condition: "resource"
      assay: "resource"

  variant_effect_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      In-silico PREDICTED effects of variants on chromatin accessibility from
      deep-learning models (ChromBPNet and FLARE). Variant-indexed: one row per
      variant per model/context with a predicted effect score. These are model
      predictions, not measured associations. Always filter by resource, not
      dataset.

    columns:
      chr: "Chromosome number (GRCh38, chromosome X is 23)"
      pos: "Genomic position (GRCh38)"
      ref: "Reference allele"
      alt: "Alternative allele"
      variant: "Variant identifier as chr:pos:ref:alt, chromosome X is 23"
      rsid: "dbSNP rsID"
      dataset: "Source dataset identifier"
      model: "Prediction model (chrombpnet, flare)"
      cell_type: "Cell-type context (NA for pan-context FLARE predictions)"
      tissue: "Harmonized tissue (e.g. brain, heart, immune)"
      life_stage: "Developmental stage (fetal, adult, unknown)"
      score: "Predicted effect magnitude on accessibility"
      score_type: "Meaning of score (chrombpnet_abs_logfc, flare_score)"
      mlog10p: "-log10(p) per-context significance (ChromBPNet; NA for FLARE)"
      predicted_direction: "Predicted direction of the accessibility effect"
      quantile_rank: "Effect-strength rank (how strongly the variant is predicted to act)"
      is_significant: "Whether the predicted effect passes the model's significance threshold"
      version: "Data release version"
      resource: "Data source identifier (lowercase). Always filter by this column, not dataset"

    column_types:
      chr: INT64
      pos: INT64
      ref: STRING
      alt: STRING
      variant: STRING
      rsid: STRING
      dataset: STRING
      model: STRING
      cell_type: STRING
      tissue: STRING
      life_stage: STRING
      score: FLOAT64
      score_type: STRING
      mlog10p: FLOAT64
      predicted_direction: STRING
      quantile_rank: FLOAT64
      is_significant: BOOL
      version: STRING
      resource: STRING

    examples:
      - description: "Predicted accessibility effect of a variant per cell type"
        sql: >-
          SELECT resource, model, cell_type, tissue, score, score_type, mlog10p,
                 predicted_direction, is_significant
          FROM variant_effect_v
          WHERE variant = '1:241069353:A:G'
          ORDER BY mlog10p DESC

      - description: "Strongest ChromBPNet predicted effects near a gene"
        sql: >-
          SELECT v.variant, v.cell_type, v.tissue, v.score, v.mlog10p, v.predicted_direction
          FROM variant_effect_v v
          JOIN gene_annotations_v g
            ON v.chr = g.chr
           AND v.pos BETWEEN g.gene_start - 100000 AND g.gene_end + 100000
          WHERE g.symbol = 'PCSK9' AND v.model = 'chrombpnet'
          ORDER BY v.mlog10p DESC LIMIT 50

    categorical_columns:
      resource: null
      dataset: "resource"
      model: "resource"
      tissue: "resource"

  mpra_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      MEASURED cis-regulatory allelic activity from a massively parallel reporter
      assay (Siraj et al. 2026 MPRA). Variant x cell_line indexed: one row per variant
      per cell_line, where cell_line is 'meta' (cross-cell-line meta-analysis summary)
      or one of the 5 tested lines (K562, HEPG2, SKNSH, HCT116, A549). Reports whether
      an allele modulates reporter expression (emVar / log2Skew) and whether the element
      drives expression above background (active / log2FC). This is measured reporter
      activity, distinct from in-silico variant_effect predictions and from endogenous
      eQTL/caQTL. Always filter by resource, not dataset.

    columns:
      chr: "Chromosome number (GRCh38; X=23, Y=24, M=25). The staged file column is 'chrom'; the BigQuery view exposes it as INT64 'chr'"
      pos: "Genomic position (GRCh38)"
      variant: "Variant identifier as chr:pos:ref:alt (chromosome X=23)"
      ref: "Reference allele"
      alt: "Alternative (tested) allele"
      cohort: "Fine-mapping cohort the variant was drawn from: GTEx, UKBB, or BBJ (all fine-mapped trait variants), or control (matched controls). NA if the variant had no meta-analysis row"
      cell_line: "MPRA context — 'meta' (cross-cell-line meta-analysis summary) or one of K562, HEPG2, SKNSH, HCT116, A549. One row per variant per cell_line"
      emVar: "Whether the allele modulates reporter expression in this context (allelic skew significant)"
      active: "Whether the element drives reporter expression above background in this context"
      log2Skew: "Signed allelic effect, log2(alt/ref) of reporter activity (positive = alt drives higher expression)"
      log2Skew_se: "Standard error of log2Skew. Populated only for cell_line='meta' rows; NULL for per-cell-line rows"
      log2Skew_mlog10p: "-log10 p for allelic skew. RAW -log10 p for meta rows, but adjusted -log10 p for per-cell-line rows (per-line has no raw p) — note this meta-vs-per-line asymmetry"
      log2FC: "Element activity vs background, log2 fold change of reporter expression over background"
      log2FC_mlog10p: "-log10 p for element activity. RAW -log10 p for meta rows, Bonferroni-adjusted -log10 p for per-cell-line rows — same meta-vs-per-line asymmetry as log2Skew_mlog10p"
      mean_RNA_ref: "Mean reporter RNA level for the ref allele. Populated only for per-cell-line rows; NULL for meta rows"
      mean_RNA_alt: "Mean reporter RNA level for the alt allele. Populated only for per-cell-line rows; NULL for meta rows"
      dataset: "Source dataset identifier (constant 'siraj_mpra')"
      resource: "Data source identifier (lowercase). Always filter by this column, not dataset"

    column_types:
      chr: INT64
      pos: INT64
      variant: STRING
      ref: STRING
      alt: STRING
      cohort: STRING
      cell_line: STRING
      emVar: BOOL
      active: BOOL
      log2Skew: FLOAT64
      log2Skew_se: FLOAT64
      log2Skew_mlog10p: FLOAT64
      log2FC: FLOAT64
      log2FC_mlog10p: FLOAT64
      mean_RNA_ref: FLOAT64
      mean_RNA_alt: FLOAT64
      dataset: STRING
      resource: STRING

    examples:
      - description: "MPRA calls for a variant across all cell lines (and the meta summary)"
        sql: >-
          SELECT cell_line, emVar, active, log2Skew, log2Skew_mlog10p, log2FC, log2FC_mlog10p
          FROM mpra_v
          WHERE variant = '1:55054110:G:A'
          ORDER BY cell_line

      - description: "emVars in a region using the cross-cell-line meta summary"
        sql: >-
          SELECT variant, log2Skew, log2Skew_mlog10p, log2FC
          FROM mpra_v
          WHERE chr = 1 AND pos BETWEEN 55039974 AND 55539974
            AND cell_line = 'meta' AND emVar
          ORDER BY log2Skew_mlog10p DESC

      - description: "Per-cell-line reporter RNA levels for a variant (meta rows have mean_RNA NULL)"
        sql: >-
          SELECT cell_line, mean_RNA_ref, mean_RNA_alt, log2Skew, active
          FROM mpra_v
          WHERE variant = '1:55054110:G:A' AND cell_line != 'meta'
          ORDER BY cell_line

    categorical_columns:
      resource: null
      dataset: "resource"
      cell_line: null
      cohort: null

  hla_associations_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      Classical HLA allele associations from FinnGen R14 — every imputed HLA allele
      tested against every core R14 endpoint (~2,712 phenotypes x 187 alleles across
      10 genes). The association unit is an ALLELE (e.g. 'B*27:05'), not a nucleotide
      variant, so these rows do not join to credible_sets_v / variant_annotation_v on
      chr/pos/ref/alt; every allele of a gene shares that gene's single anchor
      position. This is the only place the cross-phenotype question is answerable
      ("which traits is an allele associated with?") — the results-api /hla endpoint
      reads per-phenotype files and can only go the other way.

      JOIN KEY WARNING — this view is the THIRD spelling of the trait column in this
      schema. credible_sets_v / colocalization_v / coloc_credsets_v /
      exome_variant_results_v / gene_burden_results_v carry both `trait_original` (the
      phenocode, the join key) and `trait` (a display string); hla_associations_v carries
      NEITHER and calls its phenocode `phenotype`. Joining phenotypes_v on h.trait or
      h.trait_original is a query error; joining on p.trait is a SILENT ZERO-ROW join.
      The only correct join is
        phenotypes_v p ON p.dataset = h.dataset AND p.trait_original = h.phenotype
      (`USING (dataset, trait_original)` does not work here — only the TRAIT column differs;
      `dataset` is present on both sides, so it must be matched explicitly against
      `phenotype`). Without SOME dataset predicate the join fans out across every FinnGen
      release sharing the code space. Background, not an alternative: all 2,712 HLA
      phenotype codes are also FinnGen R14 endpoint codes, so h.dataset is always
      'finngen_hla' and the join above is the one to write.

      COLUMN NAMES: the view emits the suite's house spelling — `mlog10p`, `se`, `af`,
      `af_cases`, `af_controls` — which is also what the results-api /v1/hla endpoint
      returns, so per-column access is uniform across the by-phenotype and by-allele
      directions and no renaming is ever needed. Their column SETS still differ, so
      concatenating them is not free: results-api additionally returns `resource`,
      `version`, `chr` and `pos`, which this view's by-allele reads need not select. Select
      the shared columns explicitly on both sides rather than concatenating whole frames.
      The staged file and the underlying `hla_associations` table keep FinnGen's native
      `mlogp`/`sebeta`/`af_alt`/`af_alt_cases`/`af_alt_controls`; the view renames them
      1:1, the values are unchanged.

    columns:
      chr: "Chromosome (always 6; the MHC). The staged file column is 'chrom'; the BigQuery view exposes it as INT64 'chr'"
      pos: "Anchor position (GRCh38) of the allele's HLA gene. Every allele of a gene shares one position, so this does NOT locate the allele itself. HLA-DRB3/DRB4/DRB5 share the placeholder 32500000"
      gene: "HLA gene symbol: HLA-A, HLA-B, HLA-C, HLA-DPB1, HLA-DQA1, HLA-DQB1, HLA-DRB1, HLA-DRB3, HLA-DRB4, HLA-DRB5"
      allele: "Imputed classical HLA allele at 4-digit (two-field) resolution, e.g. 'B*27:05'. NOT prefixed with the gene — join gene and allele for the full name"
      phenotype: "FinnGen R14 endpoint code, e.g. 'K11_COELIAC'. THE TRAIT COLUMN — this view has no `trait` or `trait_original`, so the join to phenotypes_v is `p.dataset = h.dataset AND p.trait_original = h.phenotype`, never `= h.trait`"
      pval: "Association p-value. UNDERFLOWS TO 0 for the strongest HLA signals — rank on mlog10p, never on pval"
      mlog10p: "-log10 p-value. The field to rank and threshold on (genome-wide significance is 7.3)"
      beta: "Effect size (log odds ratio for binary endpoints) per copy of the allele"
      se: "Standard error of beta"
      af: "Allele frequency in the full cohort"
      af_cases: "Allele frequency in cases. NULL for quantitative endpoints"
      af_controls: "Allele frequency in controls. NULL for quantitative endpoints"
      info: "Imputation INFO for the allele (constant per allele across phenotypes). ALWAYS check this: rare alleles imputed at INFO < 0.5 produce huge unstable betas that are artifacts, not associations"
      dataset: "Source dataset identifier (constant 'finngen_hla')"
      resource: "Data source identifier (lowercase, 'finngen'). Always filter by this column, not dataset"

    column_types:
      chr: INT64
      pos: INT64
      gene: STRING
      allele: STRING
      phenotype: STRING
      pval: FLOAT64
      mlog10p: FLOAT64
      beta: FLOAT64
      se: FLOAT64
      af: FLOAT64
      af_cases: FLOAT64
      af_controls: FLOAT64
      info: FLOAT64
      dataset: STRING
      resource: STRING

    examples:
      - description: "The HLA profile of one phenotype, strongest allele first"
        sql: >-
          SELECT gene, allele, mlog10p, beta, se, af_cases, af_controls, info
          FROM hla_associations_v
          WHERE phenotype = 'K11_COELIAC' AND mlog10p > 7.3
          ORDER BY mlog10p DESC

      - description: "Which phenotypes an allele is associated with (the cross-phenotype question)"
        sql: >-
          SELECT phenotype, mlog10p, beta, af_cases, af_controls
          FROM hla_associations_v
          WHERE allele = 'B*27:05' AND mlog10p > 7.3
          ORDER BY mlog10p DESC

      - description: "Well-imputed genome-wide significant hits only, excluding imputation artifacts"
        sql: >-
          SELECT phenotype, gene, allele, mlog10p, beta
          FROM hla_associations_v
          WHERE mlog10p > 7.3 AND info >= 0.8 AND af >= 0.005
          ORDER BY mlog10p DESC
          LIMIT 100

      - description: "Human-readable trait names for HLA hits — the join key is p.trait_original = h.phenotype, NOT h.trait (this view has no `trait` column)"
        sql: >-
          SELECT p.trait_name, h.gene, h.allele, h.mlog10p, h.beta
          FROM hla_associations_v h
          JOIN phenotypes_v p
            ON p.dataset = h.dataset AND p.trait_original = h.phenotype
          WHERE h.mlog10p > 7.3 AND h.info >= 0.8
          ORDER BY h.mlog10p DESC
          LIMIT 20

      - description: "Which HLA gene carries the lead signal for each phenotype"
        sql: >-
          SELECT phenotype, ARRAY_AGG(STRUCT(gene, allele, mlog10p)
                   ORDER BY mlog10p DESC LIMIT 1)[OFFSET(0)] AS lead
          FROM hla_associations_v
          WHERE mlog10p > 7.3 AND info >= 0.8
          GROUP BY phenotype

    categorical_columns:
      resource: null
      dataset: "resource"
      gene: null

  gene_annotations_v:
    exposed: true
    resource_derivation:
      mode: none
      reason: >-
        single-source reference table (Ensembl/GENCODE): the view appends the constant
        'hgnc' AS resource, and the base table carries no `dataset` column for a CASE to
        switch on
    dataset_cross_check:
      excluded_reason: >-
        gene coordinate reference, has no `dataset` column
    description: >-
      Whole-universe gene annotations, one row per gene: HGNC core fields joined to
      GENCODE GRCh38 coordinates, with full-lineage HGNC gene-group arrays
      (gene_group_ids / gene_group_names contain the leaf group plus all of its
      ancestor groups, so any group can be matched with `<id> IN UNNEST(gene_group_ids)`).
      A reference table reached only via query_bigquery; primarily used to join gene
      coordinates against the result views (e.g. colocalization_v) for cis/trans QTL
      scans that cannot be done inside the API.

      Filtering tips: restrict to real genes with
      `locus_type = 'gene with protein product'`; for GPCR-type questions exclude
      olfactory receptors (they are GPCRs that dominate large families by count) with
      `NOT ('Olfactory receptors' IN UNNEST(gene_group_names))`. When joining the
      protein symbol in colocalization_v.trait2, note some pQTL datasets append
      suffixes (e.g. 'ACP1.3858.5.1..1'), so match on
      `SPLIT(c.trait2, '.')[OFFSET(0)]` and also require `c.chr = a.chr`.

    columns:
      hgnc_id: "HGNC ID (e.g. HGNC:5)"
      symbol: "HGNC approved gene symbol (e.g. PCSK9)"
      name: "HGNC approved gene name"
      prev_symbols: "Previous HGNC symbols, pipe-delimited"
      alias_symbols: "Alias symbols, pipe-delimited"
      ensembl_gene_id: "Ensembl gene ID (e.g. ENSG00000169174)"
      ncbi_gene_id: "NCBI (Entrez) gene ID"
      chr: "Chromosome number (GRCh38, chromosome X encoded as 23)"
      gene_start: "Gene start position (GRCh38, GENCODE)"
      gene_end: "Gene end position (GRCh38, GENCODE)"
      strand: "Strand (+ or -)"
      locus_type: "HGNC locus type (e.g. gene with protein product, pseudogene, RNA gene)"
      gene_group_ids: "Full-lineage HGNC gene-group IDs (ARRAY<INT64>: leaf group plus all ancestors). Match a group with `<id> IN UNNEST(gene_group_ids)`"
      gene_group_names: "Full-lineage HGNC gene-group names (ARRAY<STRING>: leaf group plus all ancestors)"
      gencode_version: "GENCODE release used for coordinates"
      hgnc_version: "HGNC complete-set version/date used"
      download_date: "Date the source data was downloaded/built"
      resource: "Data source identifier, constant 'hgnc'"

    column_types:
      hgnc_id: STRING
      symbol: STRING
      name: STRING
      prev_symbols: STRING
      alias_symbols: STRING
      ensembl_gene_id: STRING
      ncbi_gene_id: STRING
      chr: INT64
      gene_start: INT64
      gene_end: INT64
      strand: STRING
      locus_type: STRING
      gene_group_ids: ARRAY<INT64>
      gene_group_names: ARRAY<STRING>
      gencode_version: STRING
      hgnc_version: STRING
      download_date: DATE
      resource: STRING

    examples:
      - description: "Coordinates for a set of genes, to drive window queries against the result views. A symbol can have several rows, so aggregate to one interval per gene; chr is INT64 here and in the result views, so joins need no casting."
        sql: |-
          SELECT symbol, chr, MIN(gene_start) AS gene_start, MAX(gene_end) AS gene_end,
                 strand, ensembl_gene_id
          FROM gene_annotations_v
          WHERE symbol IN ('PCSK9', 'NOD2', 'TLN1')
          GROUP BY symbol, chr, strand, ensembl_gene_id
          ORDER BY symbol

      - description: "Enumerate protein-coding genes in an HGNC gene group (here GPCRs, group 139), excluding olfactory receptors, with coordinates"
        sql: >-
          SELECT symbol, chr, gene_start, gene_end
          FROM gene_annotations_v
          WHERE 139 IN UNNEST(gene_group_ids)
            AND locus_type = 'gene with protein product'
            AND NOT ('Olfactory receptors' IN UNNEST(gene_group_names))

      - description: "cis-pQTL colocalizations for a whole gene group (GPCRs): gene joined to colocalization_v where the pQTL (PP_H4>0.8) lead variant lies within 1Mb of the gene body. Matches the protein symbol allowing dataset suffixes and requires same-chromosome."
        sql: >-
          WITH gpcr AS (
            SELECT symbol, chr, gene_start, gene_end
            FROM gene_annotations_v
            WHERE 139 IN UNNEST(gene_group_ids)
              AND locus_type = 'gene with protein product'
              AND NOT ('Olfactory receptors' IN UNNEST(gene_group_names))
          )
          SELECT a.symbol,
                 COUNT(DISTINCT c.trait1_original) AS n_gwas_traits,
                 COUNT(*) AS n_coloc_pairs,
                 ROUND(MAX(c.PP_H4_abf), 3) AS max_pp_h4
          FROM gpcr a
          JOIN colocalization_v c
            ON SPLIT(c.trait2, '.')[OFFSET(0)] = a.symbol
           AND c.chr = a.chr
          WHERE c.data_type2 = 'pQTL'
            AND c.PP_H4_abf > 0.8
            AND SAFE_CAST(SPLIT(c.hit2, ':')[OFFSET(1)] AS INT64)
                BETWEEN a.gene_start - 1000000 AND a.gene_end + 1000000
          GROUP BY a.symbol
          ORDER BY n_gwas_traits DESC, a.symbol

    categorical_columns:
      resource: null
      locus_type: null
      strand: null

  variant_annotation_v:
    exposed: true
    resource_derivation:
      mode: none
      reason: >-
        single-source reference table: the view appends the constant 'finngen' AS resource,
        and the base table carries no `dataset` column for a CASE to switch on
    dataset_cross_check:
      excluded_reason: >-
        variant annotation reference, has no `dataset` column
    description: >-
      Per-variant functional annotation and FinnGen (R14) allele frequencies —
      one row per variant, covering all imputed variants, not only fine-mapped ones.
      This is the only view with rsIDs and genotype counts: join to it whenever a
      question needs an rsID, an allele frequency, imputation quality, or Finnish
      enrichment for variants found in the association views. Association results
      are not here — use credible_sets_v, exome_variant_results_v etc. for those.

    columns:
      variant: "Variant identifier as chr:pos:ref:alt, chromosome X is 23. Same format as the variant column in the association views, so it joins directly"
      chr: "Chromosome number, chromosome X is 23"
      pos: "Genomic position (GRCh38)"
      ref: "Reference allele"
      alt: "Alternative (effect) allele"
      INFO: "Imputation INFO score (imputation quality, 0-1). Low values indicate poorly imputed variants"
      AF: "Alternative allele frequency in FinnGen. This is the alt allele frequency, not the minor allele frequency — there is no maf column, use LEAST(AF, 1 - AF)"
      AC_Het: "Number of heterozygous genotypes in FinnGen"
      AC_Hom: "Number of homozygous (alt/alt) genotypes in FinnGen"
      most_severe: "Most severe VEP-predicted variant consequence"
      gene_most_severe: "Gene symbol associated with the most severe consequence"
      rsid: "dbSNP rsID when available. The only place rsIDs are stored — the association views have none"
      EXOME_enrichment_nfe: "Finnish vs non-Finnish European allele-frequency ratio from gnomAD exomes. Values above ~2 mark Finnish-enriched variants"
      GENOME_enrichment_nfe: "Finnish vs non-Finnish European allele-frequency ratio from gnomAD genomes"
      index: "Row index in the source annotation file, not a genetic quantity"
      resource: "Data source identifier, constant 'finngen' (FinnGen R14)"

    column_types:
      variant: STRING
      chr: INT64
      pos: INT64
      ref: STRING
      alt: STRING
      INFO: FLOAT64
      AF: FLOAT64
      AC_Het: INT64
      AC_Hom: INT64
      most_severe: STRING
      gene_most_severe: STRING
      rsid: STRING
      EXOME_enrichment_nfe: FLOAT64
      GENOME_enrichment_nfe: FLOAT64
      index: INT64
      resource: STRING

    examples:
      - description: "Translate an rsID to the chr:pos:ref:alt identifier the association views use. rsid is neither partitioned nor clustered, so this scans the whole table — add a chr filter whenever the chromosome is already known."
        sql: |-
          SELECT variant, chr, pos, ref, alt, rsid, most_severe, gene_most_severe,
                 AF, AC_Het, AC_Hom, INFO
          FROM variant_annotation_v
          WHERE rsid = 'rs11591147'

      - description: "Attach rsIDs, allele frequencies and Finnish enrichment to fine-mapped variants. credible_sets_v has no rsid, AF, AC_Het, AC_Hom or enrichment columns — join here for them, matching on chr as well so the join prunes partitions."
        sql: |-
          WITH cs AS (
            SELECT DISTINCT chr, variant, trait, trait_original, pip, mlog10p, beta
            FROM credible_sets_v
            WHERE resource = 'finngen' AND data_type = 'GWAS'
              AND trait_original = 'K11_IBD_STRICT' AND pip > 0.1
          )
          SELECT cs.trait_original, cs.variant, va.rsid, va.most_severe, va.gene_most_severe,
                 cs.pip, cs.mlog10p, cs.beta, va.AF, va.AC_Het, va.AC_Hom,
                 va.EXOME_enrichment_nfe, va.INFO
          FROM cs
          JOIN variant_annotation_v va ON va.chr = cs.chr AND va.variant = cs.variant
          ORDER BY cs.pip DESC

      - description: "Finnish-enriched coding variants in a gene, regardless of whether they are associated with anything. The table is clustered by most_severe and gene_most_severe, so filtering on both is cheap."
        sql: |-
          SELECT variant, rsid, most_severe, gene_most_severe, AF,
                 ROUND(LEAST(AF, 1 - AF), 5) AS maf, AC_Het, AC_Hom,
                 EXOME_enrichment_nfe, GENOME_enrichment_nfe
          FROM variant_annotation_v
          WHERE gene_most_severe = 'PCSK9'
            AND most_severe IN ('missense_variant', 'frameshift_variant', 'stop_gained',
                                'splice_acceptor_variant', 'splice_donor_variant')
            AND EXOME_enrichment_nfe > 2
          ORDER BY AF DESC

    categorical_columns:
      resource: null

  peak_to_gene_v:
    exposed: true
    resource_derivation:
      mode: view_case
    description: >-
      Open4Gene peak-to-gene links from FinnGen ATAC-seq: which genes a chromatin
      peak's accessibility is associated with, in which cell type. One row per
      (peak, gene, cell type); only significant links are published, so a missing
      row means no significant link was found, not evidence against one.
      THIS IS THE TABLE THAT MAKES caQTL RESULTS GENE-BASED: caQTL rows in
      credible_sets_v carry a PEAK id in trait (e.g. chr5-35482826-35484273), not a
      gene, so a gene-based caQTL question must join through this table on
      peak_id = trait (and cell_type = cell_type for the cell-type-matched answer).
      Do NOT approximate the link by comparing peak and gene coordinates: linked
      peaks sit up to ~1 Mb from the gene and most peaks near a gene are not linked
      to it. When the gene's chromosome is known, add a literal `cs.chr = <n>`
      predicate to the join query — credible_sets is partitioned by chr, so this
      cuts the scan by an order of magnitude.

    columns:
      chr: "Chromosome number (GRCh38; X=23)"
      peak_start: "Peak interval start (GRCh38)"
      peak_end: "Peak interval end (GRCh38)"
      peak_id: >-
        Peak identifier as chr-start-end, chr-PREFIXED verbatim from Open4Gene,
        e.g. chr5-35482826-35484273; join to credible_sets_v.trait for caQTL rows.
        Distinct id space from open_chromatin_v.peak_id, which is bare numeric
        (e.g. 22-20750312-20751112): the two DO NOT JOIN on peak_id.
      gene_id: "Linked gene Ensembl ID (no version suffix)"
      symbol: "Linked gene symbol"
      cell_type: "Cell type the link was found in (e.g. l1.CD4_T); joins credible_sets_v.cell_type"
      total_cell_num: "Total number of cells in the analysis"
      expr_cell_num: "Number of cells expressing the gene"
      open_cell_num: "Number of cells with the peak accessible"
      hurdle_zero_beta: "Effect of peak accessibility on gene detection (zero component)"
      hurdle_zero_se: "Standard error of hurdle_zero_beta"
      hurdle_zero_z: "z statistic of the zero component"
      hurdle_zero_nlog10p: "-log10 p-value of the zero component"
      hurdle_count_beta: "Effect of peak accessibility on expression level (count component)"
      hurdle_count_se: "Standard error of hurdle_count_beta"
      hurdle_count_z: "z statistic of the count component"
      hurdle_count_nlog10p: "-log10 p-value of the count component"
      hurdle_aic: "Akaike information criterion of the fitted model"
      hurdle_bic: "Bayesian information criterion of the fitted model"
      dataset: "Source dataset identifier (FinnGen_ATACseq)"
      resource: "Data source identifier (lowercase). Always filter by this column, not dataset"

    column_types:
      chr: INT64
      peak_start: INT64
      peak_end: INT64
      peak_id: STRING
      gene_id: STRING
      symbol: STRING
      cell_type: STRING
      total_cell_num: INT64
      expr_cell_num: INT64
      open_cell_num: INT64
      hurdle_zero_beta: FLOAT64
      hurdle_zero_se: FLOAT64
      hurdle_zero_z: FLOAT64
      hurdle_zero_nlog10p: FLOAT64
      hurdle_count_beta: FLOAT64
      hurdle_count_se: FLOAT64
      hurdle_count_z: FLOAT64
      hurdle_count_nlog10p: FLOAT64
      hurdle_aic: FLOAT64
      hurdle_bic: FLOAT64
      dataset: STRING
      resource: STRING

    examples:
      - description: "caQTL signals for a gene, per cell type (variant -> peak -> gene)"
        sql: >-
          SELECT l.symbol, cs.cell_type, cs.trait AS peak_id, cs.cs_id,
                 cs.chr, cs.pos, cs.ref, cs.alt, cs.pip, cs.mlog10p
          FROM credible_sets_v cs
          JOIN peak_to_gene_v l
            ON l.peak_id = cs.trait AND l.cell_type = cs.cell_type
          WHERE cs.data_type = 'caQTL' AND l.symbol = 'IL7R'
          ORDER BY cs.cell_type, cs.chr, cs.pos

      - description: "Which peaks are linked to a gene, and in how many cell types"
        sql: >-
          SELECT peak_id, COUNT(DISTINCT cell_type) AS n_cell_types,
                 MAX(hurdle_zero_nlog10p) AS best_nlog10p
          FROM peak_to_gene_v
          WHERE symbol = 'IL7R'
          GROUP BY peak_id
          ORDER BY best_nlog10p DESC

      - description: "Genes a caQTL credible set variant may act on, via its peak"
        sql: >-
          SELECT DISTINCT l.symbol, l.gene_id, cs.cell_type, cs.trait AS peak_id, cs.pip
          FROM credible_sets_v cs
          JOIN peak_to_gene_v l
            ON l.peak_id = cs.trait AND l.cell_type = cs.cell_type
          WHERE cs.data_type = 'caQTL'
            AND cs.chr = 5 AND cs.pos = 1104823 AND cs.ref = 'C' AND cs.alt = 'T'
          ORDER BY cs.pip DESC

    categorical_columns:
      resource: null
      dataset: "resource"
      cell_type: "resource"

  phenotypes_v:
    exposed: true
    resource_derivation:
      mode: none
      reason: >-
        `resource` is a real column taken straight from this registry, which is
        authoritative; the CASE rules exist only to recover a resource from a dataset NAME
        where the registry is not available in the row
    dataset_cross_check:
      excluded_reason: >-
        built by build_phenotypes.py from the same registry-to-dataset mapping the
        cross-check validates, so including it would make the check self-confirming
    description: >-
      Trait/phenotype metadata: the human-readable name, trait type, category and
      sample sizes behind the opaque phenotype codes the results tables store.
      One row per (dataset, trait_original). Use it to RESOLVE a code to a name and
      to FILTER traits by name, category, trait type or sample size inside the same
      query, instead of a separate phenotype-lookup call.
      JOIN ON trait_original, NEVER ON trait. In every results view trait_original is
      the phenotype code and trait is a display form that differs for most rows —
      credible_sets_v for FinnGen R14 stores trait='Height,_inverse-rank_normalized'
      with trait_original='HEIGHT_IRN', gene_burden_results_v for Genebass stores
      trait='Mean corpuscular volume' with
      trait_original='continuous_30040_both_sexes__irnt', and QTL rows store a gene
      symbol in trait with the Ensembl id in trait_original. Joining on trait returns
      zero rows silently.
      COVERAGE IS PARTIAL BY DESIGN. Only datasets that ship a phenotype metadata file
      have rows: FinnGen R14/R12/Kanta/drugs, the FinnGen+UKBB and FinnGen+MVP+UKBB
      meta-analyses, Open Targets, Genebass, COVID-19 HGI and IIBDGC. QTL datasets
      (FinnGen_snRNAseq, FinnGen_ATACseq, FinnGen_Olink*, UKB_PPP, every QTD*) have
      NO rows — their traits are genes, proteins and peaks, resolved through
      gene_annotations_v and peak_to_gene_v instead. Datasets whose codes are already
      readable (PGC, GP2, BipEx2, SCHEMA2, IBD_exome) have no rows either. Use a LEFT
      JOIN when the dataset is not known in advance.
      Ranked fuzzy phenotype SEARCH is not here and cannot be — for "find me traits
      matching this free-text description" use the results-api search endpoint. This
      table serves exact resolution and SQL-expressible filtering.
      Small table (~33k rows), so an unfiltered scan is cheap.

    columns:
      dataset: "Source dataset identifier; joins the dataset column of every results view (dataset1/dataset2 in colocalization_v)"
      trait_original: "Phenotype code exactly as the results views store it; THE join key"
      trait_name: "Human-readable trait name; NULL for a handful of source rows that carry none"
      trait_type: "'binary' or 'quantitative'; NULL when the source states neither"
      category: "Source grouping — FinnGen ICD chapter, Kanta Quantitative/Binary class, Open Targets project id, or Genebass trait_type"
      n_samples: "Total analysed sample size; NULL (not 0) when unreported"
      n_cases: "Number of cases; NULL for quantitative traits and where unreported"
      n_controls: "Number of controls; NULL for quantitative traits and where unreported"
      dataset_id: "ONE contributing registry key — provenance, NOT a join key. Merged datasets_v rows keep only their first contributor as dataset_id, so values like 'finngen_kanta_r12' and 'genebass_gene_based' match no datasets_v row. Join datasets_v on `dataset`, or on `p.dataset_id IN UNNEST(d.dataset_ids)`"
      resource: "Data source identifier (lowercase). Always filter by this column, not dataset"
      author: "Study author; per-study for Open Targets, otherwise the dataset's"
      publication_date: "Publication date; NULL rather than invented when the source gives only a year"
      version: "Dataset version label (R14, R12, 26.06, ...)"
      coloc_partner_only: "TRUE for traits whose dataset exists only as a colocalization partner (FinnGen R12 core and R12 Kanta). They appear in colocalization_v but not credible_sets_v; add `AND NOT coloc_partner_only` to mirror what phenotype search returns"

    column_types:
      dataset: STRING
      trait_original: STRING
      trait_name: STRING
      trait_type: STRING
      category: STRING
      n_samples: INT64
      n_cases: INT64
      n_controls: INT64
      dataset_id: STRING
      resource: STRING
      author: STRING
      publication_date: DATE
      version: STRING
      coloc_partner_only: BOOL

    examples:
      - description: "Name the traits behind credible sets at a locus, in one query"
        sql: >-
          SELECT cs.dataset, cs.trait_original, p.trait_name, p.n_cases,
                 cs.cs_id, cs.pos, cs.ref, cs.alt, cs.pip, cs.mlog10p
          FROM credible_sets_v cs
          LEFT JOIN phenotypes_v p USING (dataset, trait_original)
          WHERE cs.chr = 6 AND cs.pos BETWEEN 32000000 AND 33000000
            AND cs.data_type = 'GWAS'
          ORDER BY cs.mlog10p DESC
          LIMIT 100

      - description: "Resolve a free-text trait to codes, then use them — no lookup roundtrip"
        sql: >-
          SELECT cs.dataset, cs.trait_original, p.trait_name,
                 cs.chr, cs.pos, cs.ref, cs.alt, cs.pip
          FROM phenotypes_v p
          JOIN credible_sets_v cs USING (dataset, trait_original)
          WHERE LOWER(p.trait_name) LIKE '%type 2 diabetes%'
            AND NOT p.coloc_partner_only
            AND cs.chr = 10
          ORDER BY cs.pip DESC
          LIMIT 100

      - description: "Well-powered binary FinnGen endpoints in one ICD chapter"
        sql: >-
          SELECT trait_original, trait_name, n_cases, n_controls
          FROM phenotypes_v
          WHERE dataset = 'FinnGen_R14' AND trait_type = 'binary'
            AND category LIKE 'IX Diseases of the circulatory system%'
            AND n_cases >= 5000
          ORDER BY n_cases DESC

      - description: "Name both sides of a colocalization (note the _original columns)"
        sql: >-
          SELECT c.dataset1, p1.trait_name AS trait1_name,
                 c.dataset2, p2.trait_name AS trait2_name,
                 c.PP_H4_abf
          FROM colocalization_v c
          LEFT JOIN phenotypes_v p1
            ON p1.dataset = c.dataset1 AND p1.trait_original = c.trait1_original
          LEFT JOIN phenotypes_v p2
            ON p2.dataset = c.dataset2 AND p2.trait_original = c.trait2_original
          WHERE c.chr = 19 AND c.PP_H4_abf > 0.8
          ORDER BY c.PP_H4_abf DESC
          LIMIT 50

    categorical_columns:
      resource: null
      dataset: "resource"
      trait_type: null

  datasets_v:
    exposed: true
    resource_derivation:
      mode: none
      reason: >-
        `resource` is a real column taken straight from this registry, which is
        authoritative; the CASE rules exist only to recover a resource from a dataset NAME
        where the registry is not available in the row
    dataset_cross_check:
      excluded_reason: >-
        built by build_phenotypes.py from the same registry-to-dataset mapping the
        cross-check validates, so including it would make the check self-confirming
    description: >-
      Dataset registry: what every `dataset` value appearing in the results views
      actually is — its resource, version, provenance, description and credible-set
      caveats. One row per dataset value, so joining on dataset never fans results out.
      Use it to explain a dataset, to pick datasets by resource or data type, and to
      check pseudo_credible_sets BEFORE interpreting pip or cs_size.
      A NULL dataset means the entry has no BigQuery presence at all — a
      summary-statistics-only product, expression, chromatin peaks or a gene-disease
      set that only results-api serves, or a registered dataset whose results are not
      loaded in this project. Those rows exist so this table answers "what
      data exists"; filter `dataset IS NOT NULL` when you want only queryable datasets.
      Most rows (841 of ~890) are eQTL Catalogue QTD sub-studies, which are the way to
      turn a tissue or cell-type question into a dataset filter for credible_sets_v.
      Small table, so an unfiltered scan is cheap.

    columns:
      dataset: "Source dataset identifier; joins the dataset column of every results view. NULL when the dataset has no BigQuery presence"
      dataset_id: "Primary registry key: the FIRST contributor where entries were merged, so it does NOT match every phenotypes_v.dataset_id. Join phenotypes_v on `dataset`, or on `p.dataset_id IN UNNEST(d.dataset_ids)`"
      dataset_ids: "ARRAY of every registry key merged into this row — more than one when several registry entries share a dataset value (pgc_scz + pgc_bip inside 'PGC', the two Genebass products inside 'genebass')"
      resource: "Data source identifier (lowercase). Always filter results views by this column, not dataset"
      resource_label: "Display label for the resource (FinnGen, Open Targets Genetics, ...)"
      resource_aliases: "ARRAY of alternative names users write for the resource; UNNEST to resolve a free-text mention"
      version: "Dataset version label (R14, 26.06, PPP, ...)"
      description: "What the dataset is, its cohort and caveats. Merged entries are concatenated with ' | '"
      author: "Producing consortium or study; for QTD sub-studies the source study label (Alasoo_2018)"
      publication_date: "Release/publication date; NULL where the registry records none"
      data_type: "gwas, eQTL, sQTL, pqtl, caqtl, gene_based, ... NOTE this is the lower-case registry vocabulary, NOT the upper-case data_type of the results views (GWAS, eQTL)"
      trait_type: "binary, quantitative or mixed at the dataset level; per-trait resolution lives in phenotypes_v.trait_type"
      n_samples: "Dataset-level sample size where the registry states one; per-trait sizes live in phenotypes_v"
      pseudo_credible_sets: "TRUE when this dataset's credible sets are PSEUDO credible sets (LD-clumped proxies), not SuSiE fine-mapping. Their pip and cs_size are not posterior quantities and must not be compared with fine-mapped ones"
      coloc_partner_only: "TRUE when the dataset exists only as a colocalization partner and ships no independently queryable product"
      collection: "TRUE for a collection whose sub-studies carry subdataset_of = its dataset_id (eQTL Catalogue). A collection row never appears as a dataset value itself"
      subdataset_of: "Parent collection's dataset_id for sub-studies (QTD ids under eqtl_catalogue); NULL otherwise"

    column_types:
      dataset: STRING
      dataset_id: STRING
      dataset_ids: ARRAY<STRING>
      resource: STRING
      resource_label: STRING
      resource_aliases: ARRAY<STRING>
      version: STRING
      description: STRING
      author: STRING
      publication_date: DATE
      data_type: STRING
      trait_type: STRING
      n_samples: INT64
      pseudo_credible_sets: BOOL
      coloc_partner_only: BOOL
      collection: BOOL
      subdataset_of: STRING

    examples:
      - description: "Flag pseudo credible sets in the same result set, not after the fact"
        sql: >-
          SELECT cs.dataset, d.pseudo_credible_sets, cs.trait_original,
                 cs.cs_id, cs.pip, cs.cs_size
          FROM credible_sets_v cs
          JOIN datasets_v d USING (dataset)
          WHERE cs.chr = 1 AND cs.pos BETWEEN 154000000 AND 155000000
          ORDER BY d.pseudo_credible_sets, cs.pip DESC

      - description: "Find the eQTL Catalogue sub-studies for a tissue, then query them"
        sql: >-
          SELECT cs.dataset, d.description, cs.trait, cs.pos, cs.ref, cs.alt, cs.pip
          FROM datasets_v d
          JOIN credible_sets_v cs USING (dataset)
          WHERE d.subdataset_of = 'eqtl_catalogue'
            AND LOWER(d.description) LIKE '%macrophage%'
            AND cs.trait = 'IL7R'
          ORDER BY cs.pip DESC

      - description: "What queryable datasets exist for a resource, newest first"
        sql: >-
          SELECT dataset, version, data_type, n_samples, publication_date, description
          FROM datasets_v
          WHERE resource = 'finngen' AND dataset IS NOT NULL
          ORDER BY publication_date DESC

      - description: "Resolve a free-text resource mention through the alias list"
        sql: >-
          SELECT DISTINCT resource, resource_label
          FROM datasets_v, UNNEST(resource_aliases) AS alias
          WHERE LOWER(alias) LIKE '%uk biobank%'

    categorical_columns:
      resource: null
      dataset: "resource"
      data_type: null

# ---------------------------------------------------------------------------
# Dataset-to-resource mapping rules
# Ordered list — first match wins. Used to generate SQL CASE/WHEN in BQ views
# and for Python-side mapping in results-api.
# ---------------------------------------------------------------------------
dataset_to_resource_rules:
  # credible_sets_v, colocalization_v, coloc_credsets_v patterns
  - pattern: "FinnGen%MVP_UKBB%"
    resource: "finngen_mvp_ukbb"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "meta-analysis datasets including MVP"

  - pattern: "FinnGen%UKBB%"
    resource: "finngen_ukbb"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "FinnGen + UK Biobank meta-analysis (without MVP)"

  - pattern: "FinnGen%"
    resource: "finngen"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v", "peak_to_gene_v"]
    comment: "all other FinnGen datasets (peak_to_gene is FinnGen ATAC-seq only)"

  - pattern: "UKB%"
    resource: "ukbb"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "UK Biobank datasets"

  - pattern: "Open_Targets%"
    resource: "open_targets"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "Open Targets datasets (versioned names)"

  # asm_qtl_v patterns
  - pattern: "deCODE%"
    resource: "decode"
    applies_to: ["asm_qtl_v"]
    comment: "deCODE ASM-QTL datasets"

  # exome/burden-only exact matches
  - pattern: "genebass"
    resource: "genebass"
    applies_to: ["exome_variant_results_v", "gene_burden_results_v"]
    comment: "exact match for exome/burden views"

  - pattern: "IBD_exome"
    resource: "ibd_exome_2026"
    applies_to: ["exome_variant_results_v", "gene_burden_results_v"]
    comment: "IBD exome variant and gene burden results"

  - pattern: "COVID19_HGI%"
    resource: "covid_hgi"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "COVID-19 Host Genetics Initiative"

  - pattern: "PGC"
    resource: "pgc"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "PGC SCZ/BIP meta-analyses (pseudo credible sets, bundled in the shared ext file)"

  - pattern: "PGC_SCZ%"
    resource: "pgc"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "PGC SCZ published fine-mapping; the exact-match 'PGC' rule above does not cover it"

  - pattern: "GP2"
    resource: "gp2"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "GP2 Parkinson's GWAS"

  - pattern: "IIBDGC"
    resource: "ibd_gwas"
    applies_to: ["credible_sets_v", "colocalization_v", "coloc_credsets_v"]
    comment: "IIBDGC IBD/UC/CD pseudo credible sets (lowercase fallback would give 'iibdgc', not 'ibd_gwas')"

  # open_chromatin_v / variant_effect_v patterns
  - pattern: "marderstein%"
    resource: "marderstein"
    applies_to: ["open_chromatin_v", "variant_effect_v"]
    comment: "Marderstein peaks (open_chromatin) + ChromBPNet/FLARE (variant_effect)"

  - pattern: "li_brain%"
    resource: "li_brain_atac"
    applies_to: ["open_chromatin_v"]
    comment: "Li 2023 brain scATAC atlas"

  - pattern: "catlas%"
    resource: "catlas"
    applies_to: ["open_chromatin_v"]
    comment: "Catlas (Zhang 2021) body-wide scATAC atlas"

  - pattern: "epimap%"
    resource: "epimap"
    applies_to: ["open_chromatin_v"]
    comment: "EpiMap ChromHMM active states + enhancer-gene links"

  - pattern: "calderon%"
    resource: "calderon_immune"
    applies_to: ["open_chromatin_v"]
    comment: "Calderon 2019 stimulation-responsive immune chromatin"

  - pattern: "rosmap%"
    resource: "rosmap_brain"
    applies_to: ["open_chromatin_v"]
    comment: "ROSMAP (Xiong 2023) AD brain snATAC"

  # mpra_v pattern
  - pattern: "siraj_mpra%"
    resource: "siraj_mpra"
    applies_to: ["mpra_v"]
    comment: "Siraj et al. 2026 MPRA; lowercase fallback would already give 'siraj_mpra', kept explicit like the other products for clarity and applies_to scoping"

  # hla_associations_v pattern
  - pattern: "finngen_hla%"
    resource: "finngen"
    applies_to: ["hla_associations_v"]
    comment: "FinnGen R14 classical HLA allele associations; the lowercase fallback would give 'finngen_hla', not the 'finngen' resource the rest of the suite uses"

  # fallback: lowercase the dataset name
  - pattern: "*"
    resource: null
    transform: "lowercase"
    comment: "default — dataset name lowercased becomes resource"

# ---------------------------------------------------------------------------
# Profiles: per-deployment dataset registries
# ---------------------------------------------------------------------------
profiles:
  finngen:
    datasets:
      # --- GWAS ---
      finngen_gwas:
        resource: finngen
        version: "R14"
        description: >-
          FinnGen R14 core GWAS. Binary disease endpoints and height/weight/BMI
          quantitative traits in 499,755 Finnish biobank participants.
        author: "FinnGen Consortium"
        publication_date: "2026-05-13"
        data_type: gwas
        trait_type: binary
        metadata_file: "gs://finngen-commons/results_api_data/mapping_files/finngen_r14_pheno.json"
        metadata_harmonizer: finngen_r13

      finngen_hla:
        resource: finngen
        version: "R14"
        description: >-
          FinnGen R14 classical HLA allele associations. The 187 HLA alleles imputed from
          FinnGen genotype data (4-digit/two-field resolution across HLA-A, -B, -C, -DPB1,
          -DQA1, -DQB1, -DRB1, -DRB3, -DRB4, -DRB5) tested with REGENIE against the 2,712
          core R14 endpoints. The tested unit is presence of an allele, not a nucleotide
          variant, so these results carry no ref/alt and do not join to variant-keyed data
          on chr/pos/ref/alt; every allele of a gene shares that gene's anchor position.
          Each row carries the allele's imputation INFO, which is what separates a real
          association from a rare badly-imputed allele with a large unstable effect.
          Source endpoints with no R14 phenotype metadata (96 extra _WIDE codes) are not
          served, and 4 core endpoints have no HLA run.
        author: "FinnGen Consortium"
        publication_date: "2026-05-13"
        data_type: hla
        trait_type: mixed
        n_phenotypes: 2712
        metadata_file: "gs://finngen-commons/results_api_data/mapping_files/finngen_r14_pheno.json"
        metadata_harmonizer: finngen_r13

      finngen_kanta:
        resource: finngen
        version: "R14"
        description: >-
          FinnGen Kanta lab-value GWAS. These GWASs are based on clinical lab values used in
          standard medical care throughout Finland (covering public and private health care providers)
          and centralised to the KANTA register.
          The data from the Kanta register includes all basic laboratory tests used in medical care
          as well as a number of less common laboratory results. Laboratory data are available for more
          than 400,000 FinnGen participants.
          The first Kanta laboratory results are from 2014, with comprehensive results available from 2018 onwards.
          Included in the results are all available labs with >=1000 individuals (n=600).
          FinnGen's experts carried out extensive quality control of the laboratory values before introducing
          the new data into FinnGen.
          In addition, the data have been harmonised and adapted to international standards (OMOP) to facilitate
          the straightforward use of the data in research.
          GWAS phenotypes are the median of lab values for an individual (quantitative labs) or ever positive (binary labs).
        author: "FinnGen Consortium"
        publication_date: "2026-05-29"
        data_type: gwas
        trait_type: mixed
        metadata_file: "gs://finngen-commons/results_api_data/mapping_files/finngen_kanta_pheno_202605.json"
        metadata_harmonizer: finngen_kanta

      finngen_drugs:
        resource: finngen
        version: "R12"
        description: >-
          FinnGen R12 drug-purchase GWAS. These summary stats have been generated with the average
          number of drug purchases (ATC codes) as phenotypes. For each ATC code, the quantitative
          phenotype is the average number of purchases per year of follow-up with zero purchases
          included as 0.5 purchases, followed by rank-based inverse normal transformation.
          459,554 individuals were included in the analysis. We required 15 years of drug registry
          data (born before 1996 and alive in 2010) for individuals to be included in the analysis.
          ATC codes with more than 500,000 purchases in total in the dataset were chosen as basis
          of the list of phenotypes to analyze. Nearly identical ATC codes (> 90% overlap) were removed,
          and the resulting list was manually expert-curated to combine some ATC codes and add some with
          slightly less than 500,000 purchases. The GWAS analysis was done in the same way as FinnGen R12
          core analysis for quantitative phenotypes, except age^2 and age*sex were included as additional
          covariates. Each file is named by the analyzed ATC code, or combination of codes.
          ATC_TOTAL_IRN is all ATC codes combined or the average number of all drug purchases per year.
          ATC_NON_J01_TOTAL_IRN is all ATC codes except J01 (antibacterials). The results have been
          filtered by AF 0.001 and INFO score 0.6 to remove rare variant false positives.
        author: "FinnGen Consortium"
        publication_date: "2024-10-01"
        data_type: gwas
        trait_type: quantitative
        n_samples: 459553
        metadata_file: "gs://finngen-commons/results_api_data/mapping_files/finngen_r12_drugs_pheno.json"
        metadata_harmonizer: finngen_drugs

      finngen_mvp_ukbb:
        resource: finngen_mvp_ukbb
        version: "R13"
        description: >-
          FinnGen R13 + MVP + UK Biobank meta-analysis (disease endpoints).
          These genetic association results represent a multi-way meta analysis
          (using standard inverse variance weighting).
          This current release contains aligned disease endpoints/phecodes from
          VA Million Veteran Program (3 analyses: n EUR=449,042; n AFR=121,177; n AMR=59,048)
          FinnGen freeze 13 (n=500,186) UKBB (pan-UKBB European subset n=420,531).
          For these data there are pseudo credible sets, no formal fine-mapping results.
        author: "FinnGen Consortium"
        publication_date: "2025-12-19"
        data_type: gwas
        trait_type: mixed
        metadata_file: "gs://finngen-commons/results_api_data/mapping_files/finngen_r13_mvp_ukbb_nonlabs.json"
        metadata_harmonizer: finngen_r13
        pseudo_credible_sets: true

      finngen_mvp_ukbb_labs:
        resource: finngen_mvp_ukbb
        version: "R13"
        description: >-
          FinnGen R13 + MVP + UK Biobank meta-analysis (lab measurements).
          These genetic association results represent a multi-way meta analysis
          (using standard inverse variance weighting).
          This current release contains aligned lab measurements from
          VA Million Veteran Program (3 analyses: n EUR=449,042; n AFR=121,177; n AMR=59,048)
          FinnGen freeze 13 (n=500,186) UKBB (pan-UKBB European subset n=420,531).
          For these data there are pseudo credible sets, no formal fine-mapping results.
        author: "FinnGen Consortium"
        publication_date: "2025-12-19"
        data_type: gwas
        trait_type: quantitative
        metadata_file: "gs://finngen-commons/results_api_data/mapping_files/finngen_r13_mvp_ukbb_labs.json"
        metadata_harmonizer: finngen_r13
        pseudo_credible_sets: true

      finngen_ukbb:
        resource: finngen_ukbb
        version: "R13"
        description: >-
          FinnGen R13 + UK Biobank meta-analysis (disease endpoints).
          These genetic association results are from the FinnGen study meta-analyzed
          (inverse variance weighting) with 936 matching disease endpoints
          (matching based on ICD-10 definitions of endpoints) from the pan-UKBB study
          (https://pan.ukbb.broadinstitute.org/).
          European subset of the pan ukbb study was used.
          Some of the pan-ukbb endpoints were custom defined to better match the FinnGen definitions.
          The FinnGen results are based on data freeze 13, consisting of 500,186 Finnish individuals.
        author: "FinnGen Consortium"
        publication_date: "2025-12-19"
        data_type: gwas
        trait_type: mixed
        metadata_file: "gs://finngen-commons/results_api_data/mapping_files/finngen_r13_ukbb_nonlabs.json"
        metadata_harmonizer: finngen_r13
        pseudo_credible_sets: true

      finngen_ukbb_labs:
        resource: finngen_ukbb
        version: "R13"
        description: >-
          FinnGen R13 + UK Biobank meta-analysis (lab measurements).
          These genetic association results are from the FinnGen study meta-analyzed
          (inverse variance weighting) with 48 lab measurements from the pan-UKBB study
          (https://pan.ukbb.broadinstitute.org/).
          European subset of the pan ukbb study was used.
          Some of the pan-ukbb endpoints were custom defined to better match the FinnGen definitions.
          The FinnGen results are based on data freeze 13, consisting of 500,186 Finnish individuals.
        author: "FinnGen Consortium"
        publication_date: "2025-12-19"
        data_type: gwas
        trait_type: quantitative
        metadata_file: "gs://finngen-commons/results_api_data/mapping_files/finngen_r13_ukbb_labs.json"
        metadata_harmonizer: finngen_r13
        pseudo_credible_sets: true

      # --- QTL ---
      finngen_pqtl:
        resource: finngen
        version: "3K"
        description: >-
          FinnGen Olink Explore 3072 (3K) pQTL. Plasma protein levels measured primarily by
          Olink Explore 3072 (batches 1-3, meta-analysed with Olink Explore HT batch 4).
          Unrelated samples were used in analysis. Sample size is 3,561. The samples were
          collected from blood donors who were heterozygous or homozygous carriers of specific
          genetic variants of interest.
        author: "FinnGen Consortium"
        publication_date: "2025-03-20"
        data_type: pqtl
        trait_type: quantitative
        n_samples: 3561
        metadata_file: null
        metadata_harmonizer: null

      finngen_pqtl_5k:
        resource: finngen
        version: "5K"
        description: >-
          FinnGen Olink Explore HT (5K) pQTL. FG3 Cross-Batch Harmonised aggregate: plasma
          protein levels for 5,416 proteins measured by the Olink Explore HT panel in 4,118
          unrelated FinnGen participants (REGENIE association on FinnGen R13 imputed genotypes).
        author: "FinnGen Consortium"
        publication_date: "2026-05-04"
        data_type: pqtl
        trait_type: quantitative
        n_samples: 4118
        metadata_file: null
        metadata_harmonizer: null

      finngen_ukbb_pqtl:
        resource: finngen_ukbb
        version: "v1"
        description: >-
          Pan-asset three-way inverse-variance-weighted pQTL meta-analysis of FG2-3K (Olink
          Explore 3072 / 3K, N=1,732) + UKB-PPP (Olink Explore 3072 / 3K, N=42,853) + FG3
          Cross-Batch (Olink Explore HT / 5K, N=4,118). 2,831 proteins common to all three
          platforms; max combined N=48,703. GRCh38, dbSNP b156. Summary statistics only
          (no fine-mapping / credible sets; per-protein plots and QC workbook forthcoming).
        author: "FinnGen Consortium / UKB-PPP"
