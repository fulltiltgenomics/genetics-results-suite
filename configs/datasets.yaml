          sets served alongside them from the same resource. FINEMAP was run allowing several
          causal variants per locus, so posterior probabilities within one credible set sum to
          roughly the locus expected number of causal variants rather than to 1, and one set can
          span several independent signals. Most sets come from the paper extended GWAS, so their
          effect sizes and p-values are not the wave 3 ones in pgc_scz. Coordinates, alleles and
