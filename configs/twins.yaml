      - genetics-results-suite:k8s/deployments/oauth2-proxy.yaml
      - genetics-results-browser:deploy/cert.yaml
      - genetics-results-browser:deploy/cert_public.yaml
      - genetics-results-browser:deploy/ingress.yaml
      - genetics-results-browser:deploy/ingress_public.yaml
      - genetics-results-browser:deploy/statefulset.yaml
      - genetics-results-browser:deploy/volume.yaml
      - genetics-results-suite:k8s/cronjobs/keycloak-postgres-backup.yaml
      - genetics-results-suite:k8s/deployments/analyze-conversations-cronjob.yaml
      - genetics-results-suite:k8s/deployments/auth-gateway.yaml
      - genetics-results-suite:k8s/deployments/bff.yaml
      - genetics-results-suite:k8s/deployments/chat-backend.yaml
      - genetics-results-suite:k8s/deployments/db-api.yaml
      - genetics-results-suite:k8s/deployments/frontend.yaml
      - genetics-results-suite:k8s/deployments/mcp-server.yaml
      - genetics-results-suite:k8s/deployments/monitor-cronjob.yaml
      - genetics-results-suite:k8s/deployments/postgres.yaml
      - genetics-results-suite:k8s/deployments/rag-service.yaml
      - genetics-results-suite:k8s/deployments/results-api.yaml
      - genetics-results-suite:k8s/deployments/sandbox.yaml
      - genetics-results-suite:k8s/deployments/url-fetcher.yaml
      - genetics-results-suite:k8s/disruption-budgets/budgets.yaml
      - genetics-results-suite:k8s/ingress/backend-configs.yaml
      - genetics-results-suite:k8s/ingress/frontend-config.yaml
      - genetics-results-suite:k8s/network-policies/keycloak-policies.yaml
      - genetics-results-suite:k8s/network-policies/monitor-policy.yaml
      - genetics-results-suite:k8s/network-policies/policies.yaml
      - genetics-results-suite:k8s/network-policies/sandbox-policy.yaml
      - genetics-results-suite:k8s/network-policies/url-fetcher-policy.yaml
      - genetics-results-suite:k8s/volumes/pvc-chat-data.yaml
      - genetics-results-suite:k8s/volumes/pvc-keycloak-postgres.yaml
      - genetics-results-suite:k8s/volumes/pvc-monitor-data.yaml
      - genetics-results-suite:k8s/volumes/pvc-rag-stores.yaml
      - genetics-results-suite:k8s/configs/access-grant-email.yaml
      - genetics-results-suite:k8s/configs/bearer-auth-allowed.yaml
      - genetics-results-suite:k8s/namespace.yaml
    property: >-
      Each file is a Kubernetes object, so they share the key sets the Kubernetes API gives
      every object and every pod spec: apiVersion/kind/metadata/spec, containers,
      securityContext, volumeMounts, and the hardening fields this suite sets on every
      workload.
    reason: >-
      THE REPEATED NAMES ARE THE KUBERNETES SCHEMA, NOT A FACT THIS SUITE COPIED. Two
      Deployments carry the same keys because both are Deployments. What would remove the
      repetition is a template layer - kustomize or helm - and deploy.sh deliberately
      renders these files with envsubst and nothing else: scripts/test-manifest-render.py
      and scripts/test-network-policies.py parse each manifest as it is written, and a
      base-plus-patch layout would move the hardening fields those harnesses check out of
      the file a reviewer reads. DECLARED BY FILE, WITH NO SYMBOLS, because the largest of
      these groups is the top-level key set and has no name to pin. The cost is stated
      rather than hidden: a value copied between two manifests by hand - an image tag, an
      env block - is netted out here too, and this entry will not notice it. A manifest
      added later is not in the list and comes back undeclared, which is the prompt to add
      it. genetics-results-browser's deploy/ manifests are here for the same reason and are
      that repo's own standalone deployment, not a copy of this one.
    merge: open

