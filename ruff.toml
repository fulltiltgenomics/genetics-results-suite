# this repo has no Python package and so no pyproject.toml; ruff.toml is the whole
# configuration. Kept in step with the siblings' [tool.ruff] tables — the pre-commit
# lint gate is shared across the suite, so the rule set has to be too.

# py311, not the host's 3.12: sandbox/*.py runs inside the sandbox image, which is
# built FROM python:3.11-slim, so 3.11 is the real floor even though scripts/*.py
# only ever runs on the host
target-version = "py311"
exclude = [
    # sibling worktrees live under .claude/worktrees and carry their own copy of every
    # source file; without this, ruff reports each finding once per checked-out branch
    ".claude",
    # generated by scripts/gen-sandbox-docs.py, and scripts/test-sandbox-docs.py asserts
    # the committed tree is byte-identical to a fresh generation. Linting it cannot end
    # well: the generator owns every byte, so a fix here is reverted by the next build
    # while the build gate fails on the difference in between. A finding in this tree is
    # a bug report against the generator, not something to fix in the file.
    "sandbox/stubs",
]

[lint]
select = ["E", "F", "I", "W"]
# E501: line too long (handled by formatter)
# E402: module level import not at top of file
# E741: ambiguous name (`l`) — style only, and every occurrence across the suite is a
#       loop variable, so it blocks commits without ever catching a defect
ignore = ["E501", "E402", "E741"]

