# manually created PV binding chat-data PVC to a specific GCE disk
# persistentVolumeReclaimPolicy: Retain ensures the disk is never deleted by Kubernetes
apiVersion: v1
kind: PersistentVolume
metadata:
  name: chat-data-restored-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard-rwo
  claimRef:
    name: chat-data
    namespace: genetics
  csi:
    driver: pd.csi.storage.gke.io
    fsType: ext4
    volumeHandle: projects/phewas-development/zones/europe-west1-b/disks/chat-data-restored
