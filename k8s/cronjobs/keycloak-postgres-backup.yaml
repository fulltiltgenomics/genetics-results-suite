# daily logical backup of the Keycloak Postgres to GCS. Auth to GCS is via Workload
# Identity (the genetics-suite KSA -> GSA with objectAdmin on the backup bucket; the bucket
# enforces retention with a lifecycle rule, see terraform). Restore: see docs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-postgres-backup
  namespace: genetics
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: keycloak-postgres-backup
        spec:
          serviceAccountName: genetics-suite
          restartPolicy: Never
          containers:
          - name: backup
            image: google/cloud-sdk:slim
            env:
            - name: PGHOST
              value: keycloak-postgres.genetics.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: db-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: db-password
            - name: BACKUP_BUCKET
              value: "${KEYCLOAK_BACKUP_BUCKET}"
            # without this debconf probes for a Dialog/Readline frontend it cannot have in a
            # TTY-less container and warns on stderr, which GKE's logging agent tags
            # severity=ERROR and the monitor then forwards to Slack as a fake backup failure
            - name: DEBIAN_FRONTEND
              value: noninteractive
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # apt is chatty on stderr even when it succeeds, so buffer its output and
              # replay it only on failure: silence on a good run, full diagnostics on a bad one
              apt_log="$(mktemp)"
              if ! { apt-get update -qq && apt-get install -y -qq postgresql-client ; } \
                   >"$apt_log" 2>&1; then
                echo "postgresql-client install failed:" >&2
                cat "$apt_log" >&2
                exit 1
              fi
              ts="$(date -u +%Y%m%dT%H%M%SZ)"
              pg_dump -d keycloak | gzip | \
                gsutil -q cp - "gs://${BACKUP_BUCKET}/keycloak/keycloak-${ts}.sql.gz"
              echo "backup uploaded: gs://${BACKUP_BUCKET}/keycloak/keycloak-${ts}.sql.gz"
            # NOT the suite baseline, and the gap is measured, not assumed. The command above
            # apt-installs postgresql-client at run time, so this container needs a writable
            # rootfs and root. Under a bare `--cap-drop=ALL` the install fails outright against
            # this exact image — "setgroups 65534 failed", "seteuid 42 failed",
            # SetupAPTPartialDirectory chown/chmod denied, and every repository then reports
            # "no longer has a Release file" — because apt drops to the `_apt` user to download
            # and dpkg chowns what it unpacks. Dropping ALL and adding back exactly the five
            # capabilities that needs is the strictest set that works: verified by running the
            # install under `--cap-drop=ALL --cap-add=CHOWN,DAC_OVERRIDE,FOWNER,SETGID,SETUID
            # --security-opt no-new-privileges`, which installs cleanly (pg_dump 17.11, gsutil
            # 5.37 both usable). NET_RAW, NET_BIND_SERVICE, SYS_CHROOT, MKNOD, KILL,
            # AUDIT_WRITE, SETFCAP and SETPCAP are gone.
            #
            # NO readOnlyRootFilesystem and NO runAsNonRoot/runAsUser: apt-get writes
            # /var/lib/dpkg, /var/lib/apt and /usr, and needs uid 0 to do it. The backup output
            # itself is not the obstacle — pg_dump is piped through gzip straight into
            # `gsutil cp -`, so nothing is staged on disk; only mktemp's apt log is, and that
            # lands in /tmp on the rootfs. Removing the run-time install (baking
            # postgresql-client into an image) is what would let those fields be set.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "256Mi"
