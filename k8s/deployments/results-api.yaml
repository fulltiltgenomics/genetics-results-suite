apiVersion: apps/v1
kind: Deployment
metadata:
  name: results-api
  namespace: genetics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: results-api
  template:
    metadata:
      labels:
        app: results-api
    spec:
      serviceAccountName: genetics-suite
      containers:
      - name: results-api
        image: ${REGISTRY}/genetics-results-api:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: bearer-auth-allowed
        env:
        - name: DEPLOY_ENV
          value: "prod"
        - name: CONFIG_PROFILE
          value: "${CONFIG_PROFILE}"
        - name: REQUIRE_AUTH
          value: "true"
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: internal-api-secret
        - name: CHAT_BACKEND_URL
          value: "http://chat-backend.genetics.svc.cluster.local:8000/chat"
        - name: LOG_SOURCE
          value: "${LOG_SOURCE}"
        - name: DATASETS_CONFIG_PATH
          value: "/app/configs/datasets.yaml"
        volumeMounts:
        - name: datasets-config
          mountPath: /app/configs/datasets.yaml
          subPath: datasets.yaml
          readOnly: true
        # /healthz only returns 200 after lifespan startup warming completes, so a
        # 200 means the pod is warm. The startupProbe gives warming time before
        # liveness/readiness kick in; readiness then flips the moment warming
        # finishes (no fixed initial-delay floor).
        startupProbe:
          httpGet:
            path: /healthz
            port: 4000
          periodSeconds: 5
          failureThreshold: 60      # allow up to ~5 min for the first warm start
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          periodSeconds: 30
        resources:
          requests:
            cpu: "500m"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
      volumes:
      - name: datasets-config
        configMap:
          name: datasets-config
---
apiVersion: v1
kind: Service
metadata:
  name: results-api
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: results-api
