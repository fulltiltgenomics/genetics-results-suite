apiVersion: apps/v1
kind: Deployment
metadata:
  name: results-api
  namespace: genetics
spec:
  # load-bearing for the sandbox per-execution limits, not just for cost: results-api keeps the
  # aggregate response-byte budget, the request count and the concurrency slots in process memory
  # (app/core/sandbox_budget.py), so N replicas give one execution N x every one of them. Scaling
  # up — or adding an HPA — requires moving those counters to shared state first, and would also
  # multiply the pod-wide concurrency limit that bounds peak buffered response memory against this
  # pod's 8Gi. See docs/code-execution-security.md § 4.
  replicas: 1
  selector:
    matchLabels:
      app: results-api
  template:
    metadata:
      labels:
        app: results-api
    spec:
      serviceAccountName: genetics-suite
      containers:
      - name: results-api
        image: ${REGISTRY}/genetics-results-api:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: bearer-auth-allowed
        env:
        - name: DEPLOY_ENV
          value: "prod"
        - name: CONFIG_PROFILE
          value: "${CONFIG_PROFILE}"
        # match the CPU limit below: the decompress/filter process pool sizes off
        # os.cpu_count() (host cores, not the cgroup quota) unless told otherwise
        - name: TABIX_FILTER_WORKERS
          value: "2"
        # global cap on concurrent GCS range-fetch sockets (bounds open FDs)
        - name: GCS_MAX_CONNECTIONS
          value: "128"
        - name: REQUIRE_AUTH
          value: "true"
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: internal-api-secret
        # verifies the per-execution sandbox tokens chat-backend mints. A separate key from
        # internal-api-secret on purpose: separate blast radius, independent rotation. The
        # sandbox itself holds neither (docs/code-execution-security.md section 4).
        - name: SANDBOX_TOKEN_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: sandbox-token-signing-key
        # flipped to "true" by the deploy that creates the sandbox Deployment (4h6.7). While
        # true, results-api refuses to start if either secret above is unset.
        - name: SANDBOX_ENABLED
          value: "false"
        # per-execution (`jti`) limits, all at their in-code defaults. Declared here so an
        # operator can tune them without a rebuild, which is the reason they are env vars at all
        # — "env-configurable" was true of the code and false in practice while the manifest
        # named none of them. Each is a ceiling compared with >=, so results-api refuses to start
        # on a value below 1, and on TOTAL < per-execution. Raising any of them raises this pod's
        # peak buffered response memory against its 8Gi limit; see
        # docs/code-execution-security.md § 4.
        - name: SANDBOX_AGGREGATE_RESPONSE_BYTES_BUDGET
          value: "1073741824"
        - name: SANDBOX_MAX_REQUESTS_PER_EXECUTION
          value: "1000"
        - name: SANDBOX_MAX_CONCURRENT_REQUESTS
          value: "4"
        - name: SANDBOX_MAX_CONCURRENT_REQUESTS_TOTAL
          value: "8"
        - name: SANDBOX_MAX_TRACKED_EXECUTIONS
          value: "4096"
        - name: CHAT_BACKEND_URL
          value: "http://chat-backend.genetics.svc.cluster.local:8000/chat"
        - name: LOG_SOURCE
          value: "${LOG_SOURCE}"
        - name: DATASETS_CONFIG_PATH
          value: "/app/configs/datasets.yaml"
        volumeMounts:
        - name: datasets-config
          mountPath: /app/configs/datasets.yaml
          subPath: datasets.yaml
          readOnly: true
        # /healthz only returns 200 after lifespan startup warming completes, so a
        # 200 means the pod is warm. The startupProbe gives warming time before
        # liveness/readiness kick in; readiness then flips the moment warming
        # finishes (no fixed initial-delay floor).
        startupProbe:
          httpGet:
            path: /healthz
            port: 4000
          periodSeconds: 5
          failureThreshold: 60      # allow up to ~5 min for the first warm start
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "500m"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
      volumes:
      - name: datasets-config
        configMap:
          name: datasets-config
---
apiVersion: v1
kind: Service
metadata:
  name: results-api
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: results-api
