apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: genetics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      labels:
        app: chat-backend
    spec:
      serviceAccountName: genetics-suite
      # the SQLite files on chat-data are owned by uid 1031 from an earlier image, while the
      # container runs as root. That only worked because root could bypass the permission bits
      # via CAP_DAC_OVERRIDE; dropping ALL capabilities below took it away and every write
      # failed with "attempt to write a readonly database". fsGroup makes the kubelet chgrp the
      # volume to this gid and add group-write, which needs no capability in the container.
      securityContext:
        fsGroup: 1032
      # a chat turn with tool-calling loops routinely runs 1-3 minutes; the default 30s grace
      # SIGKILLs uvicorn mid-stream and truncates the answer the user is reading. Deploys get
      # correspondingly slower — Recreate waits out the old pod before starting the new one.
      terminationGracePeriodSeconds: 300
      containers:
      - name: chat-backend
        image: ${REGISTRY}/genetics-mcp-server:latest
        # uvicorn's graceful shutdown is unbounded by default, so it would wait out the full
        # grace period and then take SIGKILL. Exiting at 280s closes the SQLite handles on the
        # chat-data PVC cleanly instead.
        command: ["uvicorn", "genetics_mcp_server.chat_api:app", "--host", "0.0.0.0", "--port", "8000",
                  "--timeout-graceful-shutdown", "280"]
        ports:
        - containerPort: 8000
        # ALLOWED_EMAILS / ALLOWED_EMAIL_DOMAINS, rendered from the same terraform variables
        # oauth2-proxy itself uses, so the allow-list chat-backend applies to a proxied identity
        # (genetics-results-suite-th2) cannot refuse anyone oauth2-proxy already admitted.
        # Without this the code falls back to its finngen.fi default; it fails open rather than
        # enforcing that, so a pod missing this ConfigMap loses defence in depth but not access.
        envFrom:
        - configMapRef:
            name: bearer-auth-allowed
        env:
        - name: GENETICS_API_URL
          value: "http://results-api.genetics.svc.cluster.local:4000/api"
        - name: BIGQUERY_API_URL
          value: "http://db-api.genetics.svc.cluster.local:8080"
        - name: REQUIRE_AUTH
          value: "true"
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: internal-api-secret
        # signs the per-execution sandbox tokens. chat-backend is the only minter: it is the
        # sole caller of the sandbox and the only component that knows the end user and the
        # chat session. The sandbox holds neither this nor internal-api-secret; the tokens
        # travel in the body of the POST that submits a script and expire in 5 minutes.
        - name: SANDBOX_TOKEN_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: sandbox-token-signing-key
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: anthropic-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: openai-api-key
              optional: true
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: tavily-api-key
              optional: true
        - name: PERPLEXITY_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: perplexity-api-key
              optional: true
        - name: DEFAULT_MODEL
          value: "${DEFAULT_MODEL}"
        - name: APP_NAME
          value: "${APP_NAME}"
        - name: LLM_CONFIG_DB
          value: "/data/llm_config.db"
        - name: CHAT_HISTORY_DB
          value: "/data/chat_history.db"
        - name: ATTACHMENT_STORAGE_PATH
          value: "/data/attachments"
        - name: MAX_MESSAGE_CHARS
          value: "50000"
        - name: MAX_ATTACHMENTS_PER_MESSAGE
          value: "10"
        - name: EXTERNAL_MCP_SERVERS
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: external-mcp-servers
              optional: true
        - name: EXTERNAL_MCP_EXCLUDE_TOOLS
          value: "aou_gene_burden_phewas,aou_phenotype_top_genes,aou_phenotype_top_variants,aou_search_phenotypes,aou_variant_phewas"
        # - name: RAG_MCP_SERVER
        #   value: "http://rag-service.genetics.svc.cluster.local:8000"
        - name: DOWNLOAD_STORAGE_PATH
          value: "/data/downloads"
        - name: DOWNLOAD_TTL_SECONDS
          value: "2592000"
        - name: ENABLE_ADMIN_PAGE
          value: "true"
        - name: ADMIN_USERS
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: admin-users
              optional: true
        - name: ENABLE_SUBAGENTS
          value: "false"
        - name: SUBAGENT_MODEL
          value: ""
        - name: SUBAGENT_TIMEOUT
          value: "120"
        - name: SUBAGENT_ALLOWED_PATHS
          value: "/data"
        - name: ENABLE_SCRIPT_EXECUTION
          value: "false"
        - name: SUBAGENT_SCRIPT_TIMEOUT
          value: "30"
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: chat-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        # leave the Service endpoints before uvicorn stops accepting, so a request arriving as
        # SIGTERM lands isn't met with connection refused
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
      volumes:
      - name: chat-data
        persistentVolumeClaim:
          claimName: chat-data
---
apiVersion: v1
kind: Service
metadata:
  name: chat-backend
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: chat-backend
