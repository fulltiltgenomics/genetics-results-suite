apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: genetics
spec:
  # load-bearing for read_artifact, not just for cost: chat-backend resolves an artifact name
  # to an execution id through _ArtifactManifests, a process-wide in-memory map keyed by chat
  # session (tools/executor.py in genetics-mcp-server). N replicas mean a read routed to a
  # replica that did not run the analysis resolves nothing and returns "not found" for an
  # artifact that exists. Scaling up — or adding an HPA — requires moving that map to shared
  # state first, or sticky sessions. Same premise as db-api's per-execution byte counter and
  # results-api's sandbox budget. See docs/code-execution-security.md § 6.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chat-backend
  template:
    metadata:
      labels:
        app: chat-backend
    spec:
      serviceAccountName: genetics-suite
      # the SQLite files on chat-data are owned by uid 1031 from an earlier image, while the
      # container runs as root. That only worked because root could bypass the permission bits
      # via CAP_DAC_OVERRIDE; dropping ALL capabilities below took it away and every write
      # failed with "attempt to write a readonly database". fsGroup makes the kubelet chgrp the
      # volume to this gid and add group-write, which needs no capability in the container.
      securityContext:
        fsGroup: 1032
      # a chat turn with tool-calling loops routinely runs 1-3 minutes; the default 30s grace
      # SIGKILLs uvicorn mid-stream and truncates the answer the user is reading. Deploys get
      # correspondingly slower — Recreate waits out the old pod before starting the new one.
      terminationGracePeriodSeconds: 300
      containers:
      - name: chat-backend
        image: ${REGISTRY}/genetics-mcp-server:latest
        # uvicorn's graceful shutdown is unbounded by default, so it would wait out the full
        # grace period and then take SIGKILL. Exiting at 280s closes the SQLite handles on the
        # chat-data PVC cleanly instead. This bounds the wait for open connections only; a chat
        # turn whose browser is gone is a task, not a connection, and the service's lifespan
        # waits for those itself (TURN_DRAIN_TIMEOUT_S, default 270) before closing.
        command: ["uvicorn", "genetics_mcp_server.chat_api:app", "--host", "0.0.0.0", "--port", "8000",
                  "--timeout-graceful-shutdown", "280"]
        ports:
        - containerPort: 8000
        # ALLOWED_EMAILS / ALLOWED_EMAIL_DOMAINS, rendered from the same terraform variables
        # oauth2-proxy itself uses, so the allow-list chat-backend applies to a proxied identity
        # cannot refuse anyone oauth2-proxy already admitted.
        # Without this the code falls back to its finngen.fi default; it fails open rather than
        # enforcing that, so a pod missing this ConfigMap loses defence in depth but not access.
        envFrom:
        - configMapRef:
            name: bearer-auth-allowed
        env:
        # the view gate: views `tables.<view>.profiles` in datasets.yaml excludes are hidden.
        # Unset or unknown hides every gated view (fail closed), so this is not optional.
        - name: CONFIG_PROFILE
          value: "${CONFIG_PROFILE}"
        - name: GENETICS_API_URL
          value: "http://results-api.genetics.svc.cluster.local:4000/api"
        - name: BIGQUERY_API_URL
          value: "http://db-api.genetics.svc.cluster.local:8080"
        - name: REQUIRE_AUTH
          value: "true"
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: internal-api-secret
        # auth-gateway's provenance secret. chat-backend gates
        # sandbox dispatch on this value arriving in X-Gateway-Auth, so only a request relayed
        # by auth-gateway after it verified an oauth2-proxy session can execute code. Mounted
        # into auth-gateway and this pod ONLY: mcp-server and results-api hold
        # internal-api-secret by design and the NetworkPolicy admits both to port 8000, so
        # anything derived from that secret — including which header it travels in — is not a
        # boundary they cannot cross. NOT optional, matching sandbox-token-signing-key: an
        # absent key holds the pod at CreateContainerConfigError instead of starting it with
        # code execution silently refused, and deploy.sh refuses to apply before that happens.
        # An EMPTY value still satisfies the kubelet and reaches the process; there it fails
        # closed at dispatch (auth.core._expected_gateway_marker) and logs at startup.
        - name: GATEWAY_IDENTITY_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: gateway-identity-secret
        # signs the per-execution sandbox tokens. chat-backend is the only minter: it is the
        # sole caller of the sandbox and the only component that knows the end user and the
        # chat session. The sandbox holds neither this nor internal-api-secret; the tokens
        # travel in the body of the POST that submits a script and expire in 5 minutes.
        - name: SANDBOX_TOKEN_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: sandbox-token-signing-key
        # a deployment fact, not a preference: whether the sandbox this pod would submit
        # run_analysis calls to actually exists. Declared explicitly rather than left to
        # settings.py's own "false" default so the value is reviewable here, alongside the
        # same-named flag on db-api and results-api — flipped to "true" only by the deploy
        # that creates the sandbox Deployment, never on its own.
        - name: SANDBOX_ENABLED
          value: "true"
        # the sandbox supervisor's in-cluster Service (k8s/deployments/sandbox.yaml: Service
        # `sandbox` in namespace `genetics`, port 8080). NOT optional and there is no client
        # default any more: an unset SANDBOX_URL raises SandboxNotConfigured when the client
        # is built, so this line is what the first
        # SANDBOX_ENABLED="true" deploy depends on. Set even while the flag is false, so
        # flipping the flag is the only change that deploy has to make.
        - name: SANDBOX_URL
          value: "http://sandbox.genetics.svc.cluster.local:8080"
        # the url-fetcher's in-cluster Service (k8s/deployments/url-fetcher.yaml: Service
        # `url-fetcher` in namespace `genetics`, port 8090). Unset, run_analysis refuses a
        # `{url}` input and tells the model to use an attachment instead; attachment inputs
        # do not depend on it.
        - name: URL_FETCHER_URL
          value: "http://url-fetcher.genetics.svc.cluster.local:8090"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: anthropic-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: openai-api-key
              optional: true
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: tavily-api-key
              optional: true
        - name: PERPLEXITY_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: perplexity-api-key
              optional: true
        # the deployment's own switch (terraform/variables.tf alphagenome_enabled, resolved
        # by scripts/deploy.sh). Settings.disabled_tools withdraws both AlphaGenome tools
        # whenever this is false, independent of whether a key happens to be configured.
        - name: ALPHAGENOME_ENABLED
          value: "${ALPHAGENOME_ENABLED}"
        # true exactly where results-api has a cell-type expression release pointer (derived by
        # scripts/deploy.sh from the same tfvar); false withdraws get_cell_type_expression.
        - name: CELL_TYPE_EXPRESSION_ENABLED
          value: "${CELL_TYPE_EXPRESSION_ENABLED}"
        # optional even where the flag above is true: with no key Settings.disabled_tools
        # withdraws get_alphagenome_variant_predictions too, so the model is never offered a
        # tool whose every call would fail. chat-backend is the only holder — results-api
        # and the sandbox never see it.
        - name: ALPHAGENOME_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: alphagenome-api-key
              optional: true
        - name: DEFAULT_MODEL
          value: "${DEFAULT_MODEL}"
        - name: APP_NAME
          value: "${APP_NAME}"
        - name: LLM_CONFIG_DB
          value: "/data/llm_config.db"
        - name: CHAT_HISTORY_DB
          value: "/data/chat_history.db"
        - name: ATTACHMENT_STORAGE_PATH
          value: "/data/attachments"
        - name: MAX_MESSAGE_CHARS
          value: "50000"
        - name: MAX_ATTACHMENTS_PER_MESSAGE
          value: "10"
        - name: EXTERNAL_MCP_SERVERS
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: external-mcp-servers
              optional: true
        - name: EXTERNAL_MCP_EXCLUDE_TOOLS
          value: "aou_gene_burden_phewas,aou_phenotype_top_genes,aou_phenotype_top_variants,aou_search_phenotypes,aou_variant_phewas"
        # the operator's browser login for C3PO (docs/chat-tool-reference.md § 6); read by the
        # `oauth=C3PO_MCP_OAUTH` option of the C3PO entry in EXTERNAL_MCP_SERVERS
        - name: C3PO_MCP_OAUTH
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: c3po-mcp-oauth
              optional: true
        # the same for DepMap; the entry exists in both daly clusters' EXTERNAL_MCP_SERVERS,
        # each from its own login, and the key is empty in finngen
        - name: DEPMAP_MCP_OAUTH
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: depmap-mcp-oauth
              optional: true
        # rotated OAuth refresh tokens land here; on the PVC, because the issuer retires a
        # refresh token once it is used and a restart that re-read the seed would be locked out
        - name: EXTERNAL_MCP_STATE_DIR
          value: "/data/mcp-oauth"
        # - name: RAG_MCP_SERVER
        #   value: "http://rag-service.genetics.svc.cluster.local:8000"
        - name: DOWNLOAD_STORAGE_PATH
          value: "/data/downloads"
        - name: DOWNLOAD_TTL_SECONDS
          value: "2592000"
        - name: ENABLE_ADMIN_PAGE
          value: "true"
        - name: ADMIN_USERS
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: admin-users
              optional: true
        # runtime access grants (genetics-mcp-server access_grants.py): an admin admits an
        # address until ACCESS_GRANT_EXPIRES_AT with no deploy. The label is the switch — empty
        # shows no button and runs no reconciler, which is every deployment that leaves these
        # unset in its .env. The reconciler rewrites the oauth2-proxy allow-list ConfigMap
        # through the API server (Role in terraform/kubernetes.tf, on this pod's
        # genetics-suite KSA) and the Keycloak realm attribute through a confidential client
        # whose secret scripts/keycloak-register-access-grants-client.sh stores; that secret
        # is what turns the Keycloak target on, so a deployment without a broker never tries.
        - name: ACCESS_GRANT_BUTTON_LABEL
          value: "${ACCESS_GRANT_BUTTON_LABEL}"
        - name: ACCESS_GRANT_EXPIRES_AT
          value: "${ACCESS_GRANT_EXPIRES_AT}"
        - name: ACCESS_GRANT_CONFIGMAP
          value: "oauth2-allowed-emails"
        - name: KEYCLOAK_ADMIN_URL
          value: "http://keycloak.genetics.svc.cluster.local:8080"
        # POST /provision/{alias}: the partner clients that may create and link their users for
        # the jwt-bearer grant (deploy.sh derives the list from the configured partner STS), and
        # the realm issuer their client-credentials tokens must carry
        - name: BROKER_PROVISIONING_CLIENTS
          value: "${BROKER_PROVISIONING_CLIENTS}"
        - name: OAUTH_ISSUER
          value: "${OAUTH_ISSUER}"
        - name: KEYCLOAK_ACCESS_GRANTS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: keycloak-access-grants-client-secret
              optional: true
        # the notification mail: authenticated SMTP with STARTTLS. From must be the account
        # SMTP_USERNAME authenticates as, or Gmail rewrites it
        - name: SMTP_HOST
          value: "${SMTP_HOST}"
        - name: SMTP_PORT
          value: "${SMTP_PORT}"
        - name: SMTP_USERNAME
          value: "${SMTP_USERNAME}"
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: smtp-password
              optional: true
        - name: ACCESS_GRANT_EMAIL_FROM
          value: "${ACCESS_GRANT_EMAIL_FROM}"
        - name: ACCESS_GRANT_EMAIL_REPLY_TO
          value: "${ACCESS_GRANT_EMAIL_REPLY_TO}"
        - name: ACCESS_GRANT_EMAIL_SUBJECT
          value: "${ACCESS_GRANT_EMAIL_SUBJECT}"
        - name: ACCESS_GRANT_EMAIL_BODY_FILE
          value: "/etc/access-grant/email.txt"
        # the profile a user starts on before choosing one, served through the user-settings
        # endpoint (the browser sends its choice on every turn, null meaning "All", so a
        # request-side default could not exist). Empty = the browser's own default, the full
        # surface; a deployment sets it in its .env.<name>. It rides the deployments envsubst
        # whitelist in scripts/deploy.sh, so an unset variable renders as "".
        - name: DEFAULT_TOOL_PROFILE
          value: "${DEFAULT_TOOL_PROFILE}"
        - name: ENABLE_SUBAGENTS
          value: "false"
        - name: SUBAGENT_MODEL
          value: ""
        - name: SUBAGENT_TIMEOUT
          value: "120"
        - name: SUBAGENT_ALLOWED_PATHS
          value: "/data"
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: chat-data
          mountPath: /data
        - name: access-grant-email
          mountPath: /etc/access-grant
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        # leave the Service endpoints before uvicorn stops accepting, so a request arriving as
        # SIGTERM lands isn't met with connection refused
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
      volumes:
      - name: chat-data
        persistentVolumeClaim:
          claimName: chat-data
      # the e-mail body (k8s/configs/access-grant-email.yaml); a whole-directory mount, so an
      # edit reaches the pod without a restart
      - name: access-grant-email
        configMap:
          name: access-grant-email
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: chat-backend
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: chat-backend
