apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: genetics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      serviceAccountName: genetics-suite
      containers:
      - name: rag-service
        image: ${REGISTRY}/genetics-rag-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: PROJECT_ROOT
          value: "/app"
        - name: EXPERIMENT_CONFIG
          value: "/app/experiments/configs/first_experiment.yaml"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: anthropic-api-key
        - name: COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: cohere-api-key
              optional: true
        volumeMounts:
        - name: stores
          mountPath: /app/data/stores
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
      volumes:
      - name: stores
        persistentVolumeClaim:
          claimName: rag-stores
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: rag-service
