apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: genetics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      serviceAccountName: genetics-suite
      containers:
      - name: rag-service
        image: ${REGISTRY}/genetics-rag-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: PROJECT_ROOT
          value: "/app"
        - name: EXPERIMENT_CONFIG
          value: "/app/experiments/configs/first_experiment.yaml"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: anthropic-api-key
        - name: COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: cohere-api-key
              optional: true
        volumeMounts:
        - name: stores
          mountPath: /app/data/stores
        # readOnlyRootFilesystem below leaves the image with no writable temp directory; the
        # store itself is on the PVC above, so this is the only extra path needed.
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        # NO runAsUser/runAsNonRoot. This image ships no USER directive — verified, it runs as
        # uid 0 today — and it writes the rag-stores PVC, whose live file ownership cannot be
        # seen from outside the cluster. Same call as analyze-conversations-cronjob.yaml:
        # changing who writes a PVC is the hazard, not the hardening. A confirmed uid on
        # rag-stores is what would let runAsNonRoot go on.
        #
        # HAZARD, LATENT, NOT A DEFECT AS FAR AS ANYONE HAS CHECKED — and staying root does NOT
        # cover it. `drop: ["ALL"]` takes CAP_DAC_OVERRIDE away from uid 0, so this container no
        # longer bypasses file permissions on the PVC; it only keeps the access uid 0's own mode
        # bits grant. That is exactly what bit chat-backend on chat-data in tranche 1 and is why
        # analyze-conversations needed `fsGroup: 1032`. rag-stores is a PRE-PROVISIONED GCE PD
        # (`pdName: genetics-rag-20260309`, k8s/volumes/pvc-rag-stores.yaml), not a
        # dynamically provisioned volume, so its contents may have been written by some other
        # identity — in which case writes that used to succeed only through DAC_OVERRIDE now fail.
        # No fsGroup is set here precisely because guessing a gid is the same unverified change as
        # guessing a uid. What would settle it, in one read-only command against the running pod:
        #   kubectl -n genetics exec deploy/rag-service -- ls -land /app/data/stores /app/data/stores/*
        # If everything is uid 0, or is group-writable by a gid uid 0 already holds, nothing
        # changes. If it is another uid without o+w, add that gid as fsGroup here.
        #
        # readOnlyRootFilesystem IS set, and the /tmp emptyDir above is what pays for it.
        # Verified against this exact image under `--cap-drop=ALL --security-opt
        # no-new-privileges --read-only`: the FastMCP/uvicorn server starts, /health returns
        # {"status":"healthy","experiment":"first_experiment"}, an MCP `initialize` POST to
        # /mcp returns 200, every module under src/ imports (walk_packages, zero failures — the
        # same set as the unconstrained control), the OpenAI, Cohere and Anthropic clients all
        # construct, writes to the mounted store still succeed, and /app is unwritable. The one
        # place this code mkdirs outside the store is the `init` subcommand (checkpoints_dir
        # and experiments_dir hang off PROJECT_ROOT, i.e. the rootfs) and the deployment runs
        # `http`, never `init`.
        # NOT exercised: a real retrieval, which needs a populated store and live API keys.
        # Nothing in that path should want the rootfs — embeddings and reranking are remote
        # HTTP (OpenAI/Cohere per experiments/configs/first_experiment.yaml) and the image
        # carries no local embedding model to cache under $HOME — but it is untested here.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
      volumes:
      - name: tmp
        emptyDir: {}
      - name: stores
        persistentVolumeClaim:
          claimName: rag-stores
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: rag-service
