apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: genetics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.3
        args:
        # provider is profile-driven (env OAUTH2_PROXY_PROVIDER below): "google" (direct, e.g.
        # finngen) or "oidc" against the Keycloak broker for Google+Apple (e.g. daly).
        # email domains come from OAUTH2_PROXY_EMAIL_DOMAINS (env, comma-separated) so several
        # domains can be allowed; specific extra addresses go in the authenticated-emails file.
        - --authenticated-emails-file=/etc/oauth2-proxy/allowed-emails.txt
        - --http-address=0.0.0.0:4180
        - --reverse-proxy=true
        - --set-xauthrequest=true
        - --cookie-secure=true
        - --cookie-httponly=true
        - --cookie-samesite=lax
        - --upstream=static://200
        - --skip-provider-button=true
        ports:
        - containerPort: 4180
        env:
        - name: OAUTH2_PROXY_PROVIDER
          value: "${OAUTH2_PROVIDER}"
        # issuer is set only for the oidc provider (Keycloak); empty/ignored for google
        - name: OAUTH2_PROXY_OIDC_ISSUER_URL
          value: "${OIDC_ISSUER_URL}"
        - name: OAUTH2_PROXY_EMAIL_DOMAINS
          value: "${OAUTH_EMAIL_DOMAIN}"
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secrets
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secrets
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secrets
              key: cookie-secret
        volumeMounts:
        - name: allowed-emails
          mountPath: /etc/oauth2-proxy
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ping
            port: 4180
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: 4180
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: allowed-emails
        configMap:
          name: oauth2-allowed-emails
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 4180
    targetPort: 4180
  selector:
    app: oauth2-proxy
