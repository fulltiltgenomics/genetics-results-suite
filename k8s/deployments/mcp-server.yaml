apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: genetics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: genetics-suite
      containers:
      - name: mcp-server
        image: ${REGISTRY}/genetics-mcp-server:latest
        command: ["python", "-m", "genetics_mcp_server.mcp_server", "--transport", "streamable-http", "--port", "8080", "--host", "0.0.0.0"]
        ports:
        - containerPort: 8080
        env:
        - name: GENETICS_API_URL
          value: "http://results-api.genetics.svc.cluster.local:4000/api"
        - name: MCP_DISABLE_TRANSPORT_SECURITY
          value: "true"
        - name: MCP_API_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: mcp-api-key
              optional: true
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: internal-api-secret
              optional: true
        - name: CHAT_BACKEND_URL
          value: "http://chat-backend.genetics.svc.cluster.local:8000/chat"
        # - name: EXTERNAL_MCP_SERVERS
        #   value: "http://rag-service.genetics.svc.cluster.local:8000"
        - name: LOG_LEVEL
          value: "INFO"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 30
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: mcp-server
