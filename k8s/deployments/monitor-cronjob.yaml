apiVersion: batch/v1
kind: CronJob
metadata:
  name: monitor
  namespace: genetics
spec:
  # once a day at 08:00 UTC, after the 02:00 backup and 02:30 conversation analysis so their
  # output lands in the same report. ALERT_LOOKBACK_HOURS below must track this interval.
  schedule: "0 8 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: monitor
        spec:
          serviceAccountName: genetics-suite
          # fsGroup only, and it is NOT hardening: it makes the kubelet chgrp monitor-data to
          # gid 1000 so the volume stays writable. It is what keeps the container securityContext
          # below able to drop CAP_DAC_OVERRIDE — the container runs as uid 1000/gid 1000 (the
          # image's `monitor` user), so it writes /data/monitor.db as owner, needing no capability.
          securityContext:
            fsGroup: 1000
          restartPolicy: OnFailure
          containers:
          - name: monitor
            image: ${REGISTRY}/monitor:latest
            env:
            - name: DATASETS_CONFIG_PATH
              value: "/app/configs/datasets.yaml"
            - name: CONFIG_PROFILE
              value: "${CONFIG_PROFILE}"
            - name: GCP_PROJECT
              value: "${GCP_PROJECT}"
            - name: BQ_DATASET
              value: "${BQ_DATASET}"
            - name: K8S_NAMESPACE
              value: "genetics"
            # scopes the Cloud Logging alert query to this cluster. Both deployments in a shared
            # project use the `genetics` namespace, so without it each reports the other's errors
            - name: K8S_CLUSTER
              value: "${CLUSTER_NAME}"
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: genetics-secrets
                  key: internal-api-secret
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: genetics-secrets
                  key: slack-webhook-url
            - name: SLACK_ALERT_USER_ID
              value: "${SLACK_ALERT_USER_ID}"
            - name: MONITOR_DB_PATH
              value: "/data/monitor.db"
            # must equal the schedule interval: a shorter lookback leaves a blind spot between
            # runs, a longer one re-reports entries the previous run already covered
            - name: ALERT_LOOKBACK_HOURS
              value: "24"
            # deliberately just under the 24h interval so a still-ongoing problem re-alerts once
            # per day instead of racing the TTL boundary against cron jitter (at exactly 24h,
            # whether yesterday's dedup row has expired depends on job start times)
            - name: ALERT_DEDUP_TTL_HOURS
              value: "23"
            volumeMounts:
            - name: datasets-config
              mountPath: /app/configs/datasets.yaml
              subPath: datasets.yaml
              readOnly: true
            - name: monitor-data
              mountPath: /data
            # readOnlyRootFilesystem below leaves the image with NO writable temp directory at
            # all: verified by running this image under `--read-only` with no tmpfs, where
            # `tempfile.NamedTemporaryFile()` raises "No usable temporary directory found in
            # ['/tmp', '/var/tmp', '/usr/tmp', '/app']". Nothing in scripts/monitor/ opens a
            # tempfile itself (MONITOR_DB_PATH points at the PVC, overriding alerter.py's
            # /tmp/monitor.db default), but google/cloud/bigquery/client.py,
            # google/auth/transport/_mtls_helper.py and requests/utils.py in this image all
            # import tempfile, and those paths are not exercised by a local run without GCP
            # credentials. An emptyDir here removes the whole class rather than betting on it.
            - name: tmp
              mountPath: /tmp
            # Verified against this image: `--user 1000:1000 --cap-drop=ALL --read-only` imports
            # every monitor module, writes and commits to a sqlite db on the mounted /data, and
            # the real `python -m monitor.main --all` entrypoint reaches exactly the same
            # GCP-credentials failure it reaches unconstrained (no earlier breakage). The image
            # already declares USER monitor (uid 1000, gid 1000, per its Dockerfile), so
            # runAsUser/runAsGroup here pin what it does today rather than changing it — which
            # matters because monitor-data's existing files were written by that uid.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
          volumes:
          - name: datasets-config
            configMap:
              name: datasets-config
          - name: tmp
            emptyDir: {}
          - name: monitor-data
            persistentVolumeClaim:
              claimName: monitor-data
