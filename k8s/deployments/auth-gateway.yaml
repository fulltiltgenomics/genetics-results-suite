apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-gateway-config
  namespace: genetics
data:
  # This is a TEMPLATE, not the running config. Two substitution passes render it:
  #   1. deploy.sh's envsubst, for the public per-profile values (LEGACY_REDIRECT,
  #      KEYCLOAK_SERVER) — its whitelist deliberately omits INTERNAL_API_SECRET, so that
  #      placeholder survives verbatim. A Secret must never be baked into a ConfigMap.
  #      NEVER spell a whitelisted name as a ${...} placeholder in a comment in this file:
  #      deploy.sh envsubst's the WHOLE document, not just the nginx.conf value, and both
  #      fragments are multi-line — an expansion inside a `#` line breaks out of the comment
  #      and the render stops being valid YAML (genetics-results-suite-i5v). That is no longer
  #      a convention: scripts/test-manifest-render.py renders this file the way deploy.sh does
  #      with both fragments populated and aborts the deploy on a violation (-puv).
  #   2. the render-config initContainer below, which reads INTERNAL_API_SECRET and
  #      GATEWAY_IDENTITY_SECRET from the genetics-secrets Secret and envsubst's only those
  #      two names into an emptyDir. nginx cannot read environment variables from config
  #      directives, hence the render step. Neither name is in deploy.sh's whitelist, so both
  #      placeholders survive pass 1 verbatim — and for the same reason the ${...} spellings
  #      in these comments are safe where a whitelisted name would not be.
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr error;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      # redact token= query parameter from access logs to prevent credential leakage
      map $request_uri $sanitized_request_uri {
        "~^(?<path>[^?]*)\?token=[^&]*$"                       "$path?token=[REDACTED]";
        "~^(?<path>[^?]*)\?token=[^&]*&(?<rest>.*)$"           "$path?token=[REDACTED]&$rest";
        "~^(?<path>[^?]*)\?(?<pre>.*?)&token=[^&]*(?<post>.*)$" "$path?$pre&token=[REDACTED]$post";
        default                                                 $request_uri;
      }

      log_format redacted '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $sanitized_request_uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent"';

      proxy_buffer_size 16k;
      proxy_buffers 8 32k;
      proxy_busy_buffers_size 64k;

      # must be set here, not per-location: the auth_request subrequest is evaluated against
      # its own location's limit, so a location-level 50M is still defeated by the 1m default
      # inheriting into /oauth2/auth (chat messages with a base64 image attached exceed 1m)
      client_max_body_size 50M;

      # per-request ceiling on proxy_temp, http-level for the same reason as the line above:
      # it must cover every buffered location, present and future. nginx's default is 1024m,
      # which on a buffered location is a full GiB of node disk per in-flight request — the
      # dominant term in this pod's disk exposure (see the `cache` volume below).
      #
      # This is a BEHAVIOUR change, not a limit, and it was measured rather than reasoned
      # (genetics-results-suite-3zi). Past the ceiling nginx stops extending the temp file and
      # falls back to client-paced streaming; it does NOT truncate and does NOT 502. Measured
      # against this rendered config, one slow client (~5 MB/s) pulling a 100 MB response
      # through /api/:
      #   unset (1024m default)  HTTP 200, all 104857600 bytes, sha256 match, peak 95.6 MiB on disk
      #   64m                    HTTP 200, all 104857600 bytes, sha256 match, peak 64.0 MiB on disk
      #   0                      HTTP 200, all 104857600 bytes, sha256 match, peak 4 KiB (no temp file)
      # 64m rather than 0 because buffering is what frees the upstream worker early: /api/ goes
      # to results-api through the BFF with 300s timeouts, and 0 would pin a BFF and a
      # results-api connection open for the whole of every slow client's read. 64m keeps that
      # decoupling for every response the API actually produces and degrades gracefully above it.
      # "Gracefully" is measured, not assumed, because the obvious worry is that a blocked temp
      # file arms proxy_read_timeout and turns a slow download into a 504: with proxy_read_timeout
      # scaled 60x down to 5s and the same 100 MB / ~5 MB/s client, the result is still HTTP 200,
      # all bytes, sha256 match, clean error log. nginx does not arm the upstream read timeout
      # while the pipe is blocked on a full temp file.
      # It does NOT bound client_temp — measured, a 50M POST still spools 50.0 MiB with this at 0.
      # The floor is not a concern either: `nginx -t` accepts down to 32k, so 64m clears the
      # minimum by 2048x.
      proxy_max_temp_file_size 64m;

      access_log /dev/stdout redacted;
      resolver kube-dns.kube-system.svc.cluster.local valid=10s;

      server {
        listen 8080;

        # legacy hostname redirect — rendered by deploy.sh from redirect_from_host/
        # redirect_to_host (empty for deployments that set no redirect)
        ${LEGACY_REDIRECT}

        # health check
        location = /healthz {
          return 200 'ok';
          add_header Content-Type text/plain;
        }

        # oauth2-proxy endpoints (login, callback, sign_out)
        location /oauth2/ {
          proxy_pass http://oauth2-proxy.genetics.svc.cluster.local:4180;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # internal auth check subrequest
        location = /oauth2/auth {
          internal;
          proxy_pass http://oauth2-proxy.genetics.svc.cluster.local:4180;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Content-Length "";
          proxy_pass_request_body off;
        }

        # redirect to Google login when unauthenticated
        location @oauth2_login {
          return 302 https://$host/oauth2/start?rd=$request_uri;
        }

        # MCP server (streamable HTTP) — no oauth, uses its own bearer token auth
        # exact match for /mcp to avoid nginx's auto-redirect to /mcp/
        location = /mcp {
          proxy_pass http://mcp-server.genetics.svc.cluster.local:8080/mcp;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
          proxy_buffering off;
          proxy_cache off;
          proxy_set_header Connection '';
          proxy_http_version 1.1;
          chunked_transfer_encoding off;
        }

        # MCP OAuth protected-resource metadata (RFC 9728) — served UNAUTHENTICATED so MCP
        # clients can auto-discover the authorization server before they hold a token. Only the
        # protected-RESOURCE metadata is proxied here; the authorization-server metadata
        # (/.well-known/oauth-authorization-server) is served by Keycloak at its path-based issuer.
        location = /.well-known/oauth-protected-resource {
          proxy_pass http://mcp-server.genetics.svc.cluster.local:8080/.well-known/oauth-protected-resource;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /.well-known/oauth-protected-resource/mcp {
          proxy_pass http://mcp-server.genetics.svc.cluster.local:8080/.well-known/oauth-protected-resource/mcp;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # results API — bearer token bypass (backend validates the token)
        location @api_bearer {
          internal;
          proxy_set_header X-Goog-Authenticated-User-Email "";
          proxy_set_header X-Internal-MCP-Call "";
          proxy_pass http://results-api.genetics.svc.cluster.local:4000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
          proxy_connect_timeout 300s;
          proxy_send_timeout 300s;
        }

        # results API (browser oauth2 traffic goes through the BFF, which assembles /v1/results and
        # passes everything else through to results-api; the BFF forwards the user header below and
        # authenticates to the API with the internal secret)
        location /api/ {
          # bearer token requests bypass oauth2 AND the BFF — programmatic clients (MCP, scripts) hit
          # the raw results-api directly via @api_bearer.
          if ($http_authorization ~* "^Bearer ") {
            error_page 418 = @api_bearer;
            return 418;
          }

          auth_request /oauth2/auth;
          auth_request_set $email $upstream_http_x_auth_request_email;
          proxy_set_header X-Goog-Authenticated-User-Email "accounts.google.com:$email";
          proxy_set_header X-Internal-MCP-Call "";
          error_page 401 = @oauth2_login;

          proxy_pass http://bff.genetics.svc.cluster.local:5000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
          proxy_connect_timeout 300s;
          proxy_send_timeout 300s;
        }

        # chat backend status endpoint
        location = /status {
          auth_request /oauth2/auth;
          auth_request_set $email $upstream_http_x_auth_request_email;
          proxy_set_header X-Goog-Authenticated-User-Email "accounts.google.com:$email";
          proxy_set_header X-Internal-MCP-Call "";
          # trusted-proxy marker: chat-backend honours the identity header above only when the
          # request also carries the shared secret (genetics-results-suite-th2). It rides its own
          # header rather than Authorization so that a chat-backend still on the previous image
          # ignores it and keeps today's behaviour instead of resolving every browser user to the
          # single `mcp-tool` service identity while the gateway leads the backend in a rollout.
          # proxy_set_header redefines, so a caller-supplied X-Internal-Auth cannot survive.
          proxy_set_header X-Internal-Auth "${INTERNAL_API_SECRET}";
          # PROVENANCE, not membership (genetics-results-suite-4h6.84). The marker above says
          # only "some in-cluster service sent this": mcp-server and results-api hold
          # INTERNAL_API_SECRET by design and the NetworkPolicy admits both to chat-backend:8000,
          # so either could send the marker under ANY header name it chooses alongside an
          # identity header of its choosing. The header NAME is therefore not a secret and never
          # was. GATEWAY_IDENTITY_SECRET is a DISTINCT key mounted only into auth-gateway and
          # chat-backend, so its presence proves the request passed through the proxy that had
          # just verified an oauth2-proxy session — which is what chat-backend gates sandbox
          # dispatch on. proxy_set_header redefines here too, so a caller-supplied
          # X-Gateway-Auth cannot survive the hop.
          proxy_set_header X-Gateway-Auth "${GATEWAY_IDENTITY_SECRET}";
          error_page 401 = @oauth2_login;

          proxy_pass http://chat-backend.genetics.svc.cluster.local:8000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # chat backend API (only /chat/v1/ paths, not frontend /chat/:sessionId routes)
        location /chat/v1/ {
          auth_request /oauth2/auth;
          auth_request_set $email $upstream_http_x_auth_request_email;
          proxy_set_header X-Goog-Authenticated-User-Email "accounts.google.com:$email";
          proxy_set_header X-Internal-MCP-Call "";
          # see the notes on location = /status
          proxy_set_header X-Internal-Auth "${INTERNAL_API_SECRET}";
          proxy_set_header X-Gateway-Auth "${GATEWAY_IDENTITY_SECRET}";
          error_page 401 = @oauth2_login;

          proxy_pass http://chat-backend.genetics.svc.cluster.local:8000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # idle timeouts (reset by every SSE chunk), so these only fire when the
          # backend goes quiet — a stalled tool call, not a slow answer. Kept above
          # the load balancer's response timeout so the LB is never the shorter cap.
          proxy_read_timeout 1800s;
          proxy_connect_timeout 300s;
          proxy_send_timeout 1800s;
          # SSE streaming support
          proxy_buffering off;
          proxy_cache off;
          proxy_set_header Connection '';
          proxy_http_version 1.1;
          chunked_transfer_encoding off;
        }

        # Keycloak identity broker login path (e.g. /auth/), injected by deploy.sh only when
        # the broker is enabled (daly); empty otherwise. Served WITHOUT oauth2-proxy auth — it
        # is the auth endpoint itself. Placed before "location /" so the prefix matches first.
        ${KEYCLOAK_SERVER}

        # frontend
        location / {
          auth_request /oauth2/auth;
          auth_request_set $email $upstream_http_x_auth_request_email;
          proxy_set_header X-Goog-Authenticated-User-Email "accounts.google.com:$email";
          proxy_set_header X-Internal-MCP-Call "";
          error_page 401 = @oauth2_login;

          proxy_pass http://frontend.genetics.svc.cluster.local:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-gateway
  namespace: genetics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-gateway
  template:
    metadata:
      labels:
        app: auth-gateway
    spec:
      # the nginx MASTER runs as uid 101 too, not just the workers. The image's master normally
      # starts as root, chowns its compiled-in temp paths and setuids each worker to 101; running
      # the whole pod as 101 removes all three of those actions, so both containers can drop every
      # capability. It requires /var/cache/nginx to be writable by 101 (the `cache` emptyDir
      # below), because that path is root:root 0755 in the image and the *_temp dirs do not exist.
      # What actually makes those temp paths usable is runAsUser, not fsGroup: the initContainer's
      # `nginx -t` creates them 0700 owned by 101, and the main container runs as the same uid.
      # fsGroup cannot help there — 0700 grants the group nothing. Its narrower, still-worthwhile
      # role is the emptyDir ROOT directories the kubelet creates. The consequence: this depends
      # on runAsUser matching the uid that created the 0700 dirs, so overriding runAsUser on one
      # container breaks the gateway despite fsGroup.
      #
      # nginx makes no API-server calls, so the projected `default` ServiceAccount token was pure
      # attack surface on the internet-facing pod: an RCE here could read
      # /var/run/secrets/kubernetes.io/serviceaccount/token. MEASURED read-only, so the size of
      # what this removes is not overstated: no RoleBinding or ClusterRoleBinding in the cluster
      # names genetics:default, and the SA carries no iam.gke.io/gcp-service-account annotation,
      # so it reaches GCP not at all. Its only authorisation comes from the built-in bindings that
      # every authenticated identity gets — system:basic-user, system:discovery,
      # system:public-info-viewer, system:service-account-issuer-discovery — i.e. self-reviews,
      # /version, /healthz, the OpenAPI/discovery documents and the OIDC JWKS. So this is
      # defence-in-depth against a future binding, not the closing of a live escalation path;
      # what it does deny today is a valid cluster credential to use for reconnaissance.
      # Verified functionally inert by running the rendered config with the token directory
      # absent: /healthz, both auth_request outcomes, the Bearer bypass, /api/, /status,
      # /chat/v1/, the Keycloak fragment, the legacy 301 and /mcp are byte-identical to the run
      # with the directory mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      initContainers:
      # substitute ONLY ${INTERNAL_API_SECRET} and ${GATEWAY_IDENTITY_SECRET} — the explicit
      # shell-format argument (a space-separated list of exactly the names to expand) is what
      # keeps envsubst away from nginx's own $host/$email/$request_uri variables, and it is
      # single-quoted so the shell does not expand it before envsubst sees it. Adding a name
      # here means adding it to BOTH envsubst calls below (the real one and the placeholder
      # re-test) — a name left out of the placeholder render turns the "which half is broken"
      # diagnostic into a lie, because the two runs would no longer render the same template.
      - name: render-config
        # TAG, NOT A DIGEST, deliberately — but the tested digest is recorded because a moving tag
        # is now load-bearing in a way it was not before readOnlyRootFilesystem. The image's
        # docker-entrypoint.sh runs under `set -e`, so a future 1.27-alpine push adding a
        # /docker-entrypoint.d script without a read-only guard crash-loops the internet-facing
        # gateway instead of merely writing a stray file. All four current scripts were read out
        # of the image and are safe (10-listen-on-ipv6 exit-0s on its own touch failure,
        # 15-local-resolvers only reads /etc/resolv.conf, 20-envsubst and 30-tune return early).
        # TESTED AND LIVE, same image both ways:
        #   nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
        #   (built 2025-04-16; confirmed identical to the digest the running pod reports)
        # Not pinned because a pin here would be permanent: nothing in this repo bumps image
        # references (no renovate/dependabot, no .github at all), every other image in k8s/ is a
        # tag, and freezing an internet-facing HTTP parser at a fixed build means it never picks
        # up an nginx or musl CVE fix. Note the tag buys less than it looks like: with the default
        # IfNotPresent, a cached node keeps whatever it already pulled, so the tag is only
        # re-resolved when the pod lands on a node without the image. If the entrypoint ever does
        # change, diff against the digest above before assuming a7n's findings still hold.
        image: nginx:1.27-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          # whitelist, not blacklist: each secret lands inside an nginx string literal, where
          # nginx unescapes \t \r \n \" \' \\ and expands $variables, so a rendered config can be
          # perfectly valid while delivering a marker that does not match what chat-backend holds
          # - which reads as every chat request being unauthenticated. nginx -t below catches only
          # some of it (see docs/project-spec.md). The set below is a superset of what
          # create-secrets.sh's `openssl rand -base64 32` can produce, so this only constrains an
          # operator-supplied value; the empty pattern also rejects an unset/blank secret, which
          # would otherwise render a header nginx drops entirely. Both secrets are checked: an
          # empty GATEWAY_IDENTITY_SECRET would render an X-Gateway-Auth nginx drops, and chat
          # would keep working with code execution silently refused at every dispatch.
          check_secret() {
            eval "value=\$$1"
            case "$value" in
              ''|*[!A-Za-z0-9+/=_.-]*)
                echo "FATAL: the $2 key of the genetics-secrets Secret is empty or" >&2
                echo "holds a character nginx would reinterpret inside the header value. Allowed:" >&2
                echo "A-Z a-z 0-9 and + / = _ . - only, at least one character. Rotate it, e.g." >&2
                echo "\`openssl rand -base64 32\`. Value withheld from this log." >&2
                exit 1
                ;;
            esac
          }
          check_secret INTERNAL_API_SECRET internal-api-secret
          check_secret GATEWAY_IDENTITY_SECRET gateway-identity-secret
          envsubst '${INTERNAL_API_SECRET} ${GATEWAY_IDENTITY_SECRET}' < /etc/nginx/template/nginx.conf > /etc/nginx/rendered/nginx.conf
          # the whitelist above is what guards the secret; this validates the TEMPLATE. Catch a
          # broken config here: a failing initContainer stalls the rollout, whereas the crash-looping nginx
          # it would otherwise become slips past deploy.sh's `kubectl rollout status ... || true`
          # and the operator proceeds to the other half of the deploy believing it succeeded.
          # nginx -t also resolves the upstream names and the `resolver` host, which the main
          # container already does at startup — so this adds no dependency the pod lacked.
          if nginx -t -c /etc/nginx/rendered/nginx.conf >/dev/null 2>&1; then exit 0; fi
          # never surface nginx's own message for the rendered file: it quotes the offending
          # token, which would put a fragment of the secret into Cloud Logging. Re-test with a
          # placeholder instead to say WHICH half is broken, and print output only from the run
          # that never saw the secret.
          INTERNAL_API_SECRET=placeholder GATEWAY_IDENTITY_SECRET=placeholder \
            envsubst '${INTERNAL_API_SECRET} ${GATEWAY_IDENTITY_SECRET}' \
            < /etc/nginx/template/nginx.conf > /tmp/nginx-placeholder.conf
          if nginx -t -c /tmp/nginx-placeholder.conf >/dev/null 2>&1; then
            echo "FATAL: nginx rejected the rendered config, but accepts the same template with" >&2
            echo "placeholder secrets. The internal-api-secret or gateway-identity-secret key of" >&2
            echo "the genetics-secrets Secret contains a character nginx reads as syntax. Rotate" >&2
            echo "it to a value of A-Z a-z 0-9 and + / = _ . - only. Value withheld from this log." >&2
          else
            echo "FATAL: nginx rejected the config template itself, independently of the secret:" >&2
            nginx -t -c /tmp/nginx-placeholder.conf >&2 || true
          fi
          exit 1
        env:
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: internal-api-secret
        # auth-gateway's provenance secret (genetics-results-suite-4h6.84). Mounted here and in
        # chat-backend ONLY — deliberately not in mcp-server or results-api, because the whole
        # point is that those two cannot produce it. NOT optional: an absent key must stop the
        # gateway at CreateContainerConfigError rather than render a blank header.
        - name: GATEWAY_IDENTITY_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: gateway-identity-secret
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/template
          readOnly: true
        - name: rendered-config
          mountPath: /etc/nginx/rendered
        # `nginx -t` is not a dry run: it creates the compiled-in temp paths under
        # /var/cache/nginx, so the validation step above dies with
        # `mkdir("/var/cache/nginx/client_temp") failed (13: Permission denied)` as uid 101
        # unless the same emptyDir the main container uses is mounted here too. Doing so also
        # pre-creates the temp dirs owned by 101 before nginx itself starts.
        - name: cache
          mountPath: /var/cache/nginx
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            # CHOWN is no longer needed. The mechanism is not a warning about the `user`
            # directive — the rendered config has no `user` directive at all. nginx applies its
            # compiled-in --user default only when geteuid() == 0, so as uid 101 ccf->user stays
            # unset and ngx_create_paths skips its chown for every temp path. Verified by running
            # this exact script under `--user 101:101 --cap-drop ALL`: `nginx -t` succeeds
            # silently and leaves /var/cache/nginx/*_temp owned by 101, no chown attempted.
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "32Mi"
      containers:
      - name: nginx
        # keep in step with the initContainer's image, and see the tag-vs-digest note there
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: rendered-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        # client_body_temp / proxy_temp / fastcgi_temp / scgi_temp / uwsgi_temp live here and
        # must be writable by uid 101; the image ships the directory root:root 0755 and empty.
        # Deliberately NOT `medium: Memory`: a 50M request body (client_max_body_size) or a
        # buffered upstream response would be charged against the 128Mi memory limit.
        - name: cache
          mountPath: /var/cache/nginx
        # readOnlyRootFilesystem below makes the image layer unwritable, and the config sets
        # `pid /tmp/nginx.pid`. /var/run is NOT needed — verified, it stays read-only.
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            # Nothing is added back. NET_BIND_SERVICE is unnecessary because the only `listen`
            # is 8080 and neither fragment deploy.sh injects (LEGACY_REDIRECT,
            # KEYCLOAK_SERVER) adds a listener. CHOWN/SETUID/SETGID, which the root master
            # did need, are unnecessary because the master is uid 101 from the start: it never
            # chowns the temp paths and never setuids a worker. Verified against
            # nginx:1.27-alpine under `--user 101:101 --cap-drop ALL --read-only` with the real
            # rendered config: master and worker both Uid 101 with CapPrm/CapEff/CapBnd all 0,
            # and /healthz, the auth_request path (both outcomes), the Bearer bypass, a 20 MB
            # POST (client_body_temp) and a 20 MB buffered response (proxy_temp) all served.
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: config
        configMap:
          name: auth-gateway-config
      # the rendered config carries INTERNAL_API_SECRET and GATEWAY_IDENTITY_SECRET, so it stays
      # in the pod's memory-backed scratch space and is never written to a ConfigMap or to disk
      - name: rendered-config
        emptyDir:
          medium: Memory
      # node-disk backed on purpose (see the mount comment): nginx's temp paths, which the
      # image leaves unwritable for uid 101, plus /tmp for the pid file under a read-only rootfs
      #
      # NO sizeLimit, still deliberately, and the arithmetic is recorded here so the next reader
      # does not rediscover the question (genetics-results-suite-o5i, revisited by -3zi after
      # proxy_max_temp_file_size was bounded above). A sizeLimit does not produce ENOSPC inside
      # nginx; the kubelet EVICTS the pod, and this Deployment is replicas: 1 and internet-facing,
      # so every candidate number is a new whole-site outage path.
      #   cache: the config's own ceiling, per worker_processes 1 x worker_connections 1024 in
      #     flight, is now
      #       client_temp  1024 x 50 MiB (client_max_body_size 50M; anything over the ~16k
      #                    client_body_buffer_size default spools)          = 50 GiB
      #       proxy_temp   1024 x 64 MiB (proxy_max_temp_file_size above)   = 64 GiB
      #     = 114 GiB against ~43.83 GiB of allocatable ephemeral storage (47,060,071,478 B,
      #     re-measured 2026-08-29). Bounding proxy_max_temp_file_size took the proxy half from
      #     1 TiB to 64 GiB and the total from ~24x the disk to ~2.6x — a 9.4x cut that still does
      #     not close the arithmetic, because the half it did not touch is the reachable one.
      #     MEASURED, and this is the fact that decides the shape of the answer: a 50 MB POST to
      #     /oauth2/ with NO credential of any kind spools the full 50.0 MiB into client_temp,
      #     because that location carries no auth_request. The same POST to /api/ spools ZERO only
      #     when the request carries NO Authorization header at all — auth_request then denies at
      #     the ACCESS phase and nginx answers 302 without ever reading the body. Add any bearer
      #     prefix and it spools the full 50.0 MiB again (measured, `Authorization: Bearer
      #     not-a-real-token` -> 200, 50.0 MiB): /api/'s `if ($http_authorization ~* "^Bearer ")`
      #     runs in the REWRITE phase, ahead of auth_request, and the gateway does not validate
      #     the token — @api_bearer proxies straight to results-api, so the body is on disk before
      #     any upstream gets the chance to reject it.
      #     The auth_request-free locations, machine-derived from the RENDERED config rather than
      #     read off this file (13 locations; 9 of them carry no `auth_request /oauth2/auth`):
      #       = /healthz and @oauth2_login          `return`, no proxy_pass, no body read
      #       = /oauth2/auth                        internal, proxy_pass_request_body off
      #       /oauth2/, = /mcp, @api_bearer,
      #       = /.well-known/oauth-protected-resource,
      #       = /.well-known/oauth-protected-resource/mcp,
      #       and the injected Keycloak login location where enabled
      #                                             proxy_pass with request buffering on -> SPOOL
      #     The four that DO carry auth_request are /api/, = /status, /chat/v1/ and /. Re-derive
      #     this list rather than trusting it; @api_bearer was missed once already, and it is the
      #     one that makes /api/ anonymously reachable. No value of proxy_max_temp_file_size
      #     bounds any of it. The lever that WOULD bound it is a location-scoped
      #     client_max_body_size on the spooling members of that list — the http-level 50M exists
      #     so the /oauth2/auth SUBREQUEST inherits it (see the comment on that directive), which
      #     says nothing about what the public /oauth2/ prefix, the .well-known pair or
      #     @api_bearer need. Not done here: it is a behaviour change on the login and
      #     programmatic-API paths and wants its own traffic test.
      #     What DID become derivable is the per-connection worst case: ~64 MiB after the bound,
      #     against ~1 GiB before. A number is therefore now constructible as
      #       sizeLimit = p99 concurrent buffered requests x 64 MiB x safety factor,
      #     kept far below 43.83 GiB. The missing input is the concurrency figure, which is not
      #     obtainable from the manifest — it needs the gateway's own access log. Until it exists,
      #     shipping a guess on the internet-facing pod trades an attacker-reachable disk-fill for
      #     an attacker-reachable eviction that is roughly 10x cheaper to trigger, and both end in
      #     the same whole-site outage. What the limit would genuinely buy is confining the damage
      #     to this pod instead of the node it shares with most of the namespace.
      #   tmp: nothing an attacker can reach writes here. The main container writes only
      #     /tmp/nginx.pid (~6 bytes); the initContainer writes one ~9 KB placeholder config, and
      #     only on the config-rejected error path. A limit would bound a fill path that does not
      #     exist while adding an eviction path that does.
      # NO ephemeral-storage request or limit either, and the two halves are decided separately.
      #   A LIMIT is the worse of the two instruments, not the better one: it evicts exactly as a
      #     sizeLimit does, but it also counts this container's stdout — and the config
      #     access_logs every request to /dev/stdout — so it would be crossed by traffic VOLUME,
      #     not only by the temp files it is meant to bound. A sizeLimit on `cache` scopes to the
      #     attack path; the pod-level limit does not.
      #   The absent REQUEST is the correct setting, not merely a tolerable one: DiskPressure
      #     eviction ranks by usage ABOVE request, so naming a request would move this pod DOWN
      #     the ranking and protect the pod that filled the disk. Request 0 puts it at the top.
      #     That is a ranking, not a shield — but the reason recorded here previously ("the
      #     cluster is a single node, so DiskPressure is cluster-wide") is FALSE as measured on
      #     2026-08-30, for the two clusters this checkout can reach: finngenie-staging runs two
      #     general nodes plus a gVisor sandbox node, and finngenie (daly production) runs two.
      #     The finngen production cluster is in another project with no context here, so its
      #     count is unknown and is not asserted. The weakened form is what matters and it holds:
      #     on staging, 8 of the 11 pods running in the namespace — this one included — are
      #     co-scheduled on one general node, so DiskPressure there reaches nearly everything, but
      #     an evicted pod CAN reschedule onto the other node and the sandbox node is untouched.
      - name: cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-gateway
  namespace: genetics
  annotations:
    cloud.google.com/backend-config: '{"default": "auth-gateway-hc-config"}'
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: auth-gateway
