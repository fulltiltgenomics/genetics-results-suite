apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-api
  namespace: genetics
spec:
  # load-bearing for every per-execution limit db-api enforces, not just for cost. THREE
  # pieces of state are in process memory, and all of them must move to shared state before
  # this can be raised (or an HPA added) — moving any one alone still multiplies the others:
  #   - the per-execution BigQuery byte counter (api/main.py `_jti_bytes`): N replicas give
  #     one execution N x SANDBOX_AGGREGATE_BYTES_BUDGET;
  #   - the per-execution request-count and concurrency map (api/sandbox_budget.py
  #     `_executions`): likewise N x SANDBOX_MAX_REQUESTS_PER_EXECUTION and N x
  #     SANDBOX_MAX_CONCURRENT_REQUESTS;
  #   - the pod-wide in-flight counter (api/sandbox_budget.py `_in_flight_total`), which is
  #     per-pod by construction, so N replicas admit N x SANDBOX_MAX_CONCURRENT_REQUESTS_TOTAL.
  # See docs/code-execution-security.md § 4.
  replicas: 1
  selector:
    matchLabels:
      app: db-api
  template:
    metadata:
      labels:
        app: db-api
    spec:
      serviceAccountName: genetics-suite
      containers:
      - name: db-api
        image: ${REGISTRY}/genetics-results-db:latest
        ports:
        - containerPort: 8080
        env:
        - name: PROJECT_ID
          value: "${GCP_PROJECT}"
        # the dataset this deployment serves, substituted from the same BQ_DATASET the monitor
        # CronJob gets, so the API and the report that checks it cannot diverge. deploy.sh
        # refuses an empty value: db-api defaults this to genetics_results, so an empty render
        # would serve production data from a staging cluster without failing anywhere.
        - name: DATASET_ID
          value: "${BQ_DATASET}"
        - name: MAX_ROWS
          value: "100000"
        - name: DATASETS_CONFIG_PATH
          value: "/app/configs/datasets.yaml"
        # chat-backend and mcp-server already send this as a bearer token on every call;
        # without it here db-api serves anyone who can route to it (see NetworkPolicy note)
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: internal-api-secret
        # verifies the per-execution sandbox tokens chat-backend mints. A separate key from
        # internal-api-secret on purpose: separate blast radius, independent rotation. The
        # sandbox itself holds neither (docs/code-execution-security.md section 4).
        - name: SANDBOX_TOKEN_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: genetics-secrets
              key: sandbox-token-signing-key
        # flipped to "true" by the deploy that creates the sandbox Deployment. While
        # true, db-api refuses to start if either secret above is unset — a sandbox script can
        # otherwise be served by simply omitting the Authorization header.
        - name: SANDBOX_ENABLED
          value: "true"
        # per-execution (`jti`) request-count and concurrency limits, all at their in-code
        # defaults (api/sandbox_budget.py). Declared here so an operator can widen or tighten
        # them without a rebuild, which is the only reason they are env vars — "env-configurable"
        # is false in practice while the manifest names none of them. Each is a ceiling compared
        # with >=, so db-api refuses to start on a value below 1, and on TOTAL below the
        # per-execution bound. Raising the concurrency pair raises this pod's peak in-memory
        # BigQuery result sets against its 512Mi limit; see docs/code-execution-security.md § 4.
        - name: SANDBOX_MAX_REQUESTS_PER_EXECUTION
          value: "1000"
        - name: SANDBOX_MAX_CONCURRENT_REQUESTS
          value: "4"
        - name: SANDBOX_MAX_CONCURRENT_REQUESTS_TOTAL
          value: "8"
        - name: SANDBOX_MAX_TRACKED_EXECUTIONS
          value: "4096"
        volumeMounts:
        - name: datasets-config
          mountPath: /app/configs/datasets.yaml
          subPath: datasets.yaml
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: datasets-config
        configMap:
          name: datasets-config
---
apiVersion: v1
kind: Service
metadata:
  name: db-api
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: db-api
