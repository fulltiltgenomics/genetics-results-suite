# Keycloak identity broker: sits between oauth2-proxy and the real providers (Google +
# Apple) and exposes a single OIDC issuer at https://${KEYCLOAK_HOST}/realms/genetics.
# Runs behind the GKE ingress -> auth-gateway (TLS terminated at the ingress), so it is
# configured for an edge proxy (KC_PROXY_HEADERS=xforwarded, KC_HTTP_ENABLED=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: genetics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # Keycloak needs no Kubernetes API access here: single replica, the cache transport in
      # conf/cache-ispn.xml names no stack, and the image ships no jgroups-kubernetes jar — so
      # KUBE_PING cluster discovery is not merely unconfigured, it is unavailable. Denying the
      # projected `default` token removes a valid cluster credential for reconnaissance, not an
      # escalation path (auth-gateway.yaml has the measurement of what genetics:default reaches).
      # Scaling out with --cache-stack=kubernetes would require revisiting this.
      automountServiceAccountToken: false
      # fsGroup, and it is NOT hardening — nor is it strictly necessary. A kubelet emptyDir root
      # is created 0777 owned root:root, so uid 1000 with primary gid 0 can already write one;
      # that was measured with no fsGroup at all, and it works. Do not restate the earlier claim
      # that a root:root emptyDir "would not do" — the mode, not the owner, is what decides.
      # What fsGroup buys is determinism: the root becomes root:1000 2777 rather than relying on
      # the kubelet's default mode staying world-writable, which is the reason sandbox.yaml gives
      # for its own. Verified with the container in exactly the shape it runs in — uid 1000,
      # gid 0, supplementary group 1000 — against mounts owned root:1000 0775.
      securityContext:
        fsGroup: 1000
      containers:
      - name: keycloak
        image: ${REGISTRY}/keycloak:latest
        args: ["start", "--optimized", "--import-realm"]
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-postgres.genetics.svc.cluster.local:5432/keycloak
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: db-user
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: db-password
        # initial admin user, created only on first start (empty DB)
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-user
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-password
        - name: KC_HOSTNAME
          value: "https://${KEYCLOAK_HOST}"
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HEALTH_ENABLED
          value: "true"
        # serve the login CSS from a ConfigMap (see volumes) without caching, so tweaks apply on a
        # ConfigMap update + restart — no image rebuild, and browsers don't hold a 30-day-stale copy.
        - name: KC_SPI_THEME_CACHE_THEMES
          value: "false"
        - name: KC_SPI_THEME_CACHE_TEMPLATES
          value: "false"
        - name: KC_SPI_THEME_STATIC_MAX_AGE
          value: "-1"
        ports:
        - containerPort: 8080
        - containerPort: 9000
        volumeMounts:
        # Writable because readOnlyRootFilesystem is set below. Keycloak creates
        # /opt/keycloak/data/transaction-logs on every start (observed in an unconstrained run
        # of this image) and Quarkus/the JVM write /tmp (hsperfdata, vertx-cache, uploads).
        # The realm-import mount below nests inside this one; the kubelet orders mounts by path
        # depth, and the nesting was verified locally — the realm still imports.
        - name: data
          mountPath: /opt/keycloak/data
        - name: tmp
          mountPath: /tmp
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true
        # overrides the baked theme CSS so it can be edited via the ConfigMap (no image rebuild)
        - name: login-css
          mountPath: /opt/keycloak/themes/genetics/login/resources/css
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 30
        # Verified against this exact image under `--user 1000 --cap-drop=ALL --security-opt
        # no-new-privileges --read-only`, talking to a real postgres 16-alpine, with the two
        # mounts above emulated as tmpfs owned root:1000 0775: `start --optimized
        # --import-realm` imports the realm, creates the bootstrap admin, and /health/ready,
        # /health/live, the realm's .well-known/openid-configuration and the admin console all
        # return 200 — the same as the unconstrained run of the same image against the same DB.
        # The unconstrained run already has CapPrm/CapEff 0 (the image declares USER 1000), so
        # drop: [ALL] removes nothing it had.
        #
        # runAsGroup is deliberately NOT set. This image is uid 1000 / gid 0 and its files are
        # group-root and group-writable, so pinning a different gid would take away the access
        # the layout depends on; leaving it unset keeps the image's own gid 0. runAsNonRoot
        # still holds, because it constrains the uid only.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: realm-import
        secret:
          secretName: keycloak-realm
      - name: login-css
        configMap:
          name: keycloak-login-css
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: keycloak
