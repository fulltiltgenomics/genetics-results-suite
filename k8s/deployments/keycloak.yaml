# Keycloak identity broker: sits between oauth2-proxy and the real providers (Google +
# Apple) and exposes a single OIDC issuer at https://${KEYCLOAK_HOST}/realms/genetics.
# Runs behind the GKE ingress -> auth-gateway (TLS terminated at the ingress), so it is
# configured for an edge proxy (KC_PROXY_HEADERS=xforwarded, KC_HTTP_ENABLED=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: genetics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: ${REGISTRY}/keycloak:latest
        args: ["start", "--optimized", "--import-realm"]
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-postgres.genetics.svc.cluster.local:5432/keycloak
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: db-user
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: db-password
        # initial admin user, created only on first start (empty DB)
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-user
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-password
        - name: KC_HOSTNAME
          value: "https://${KEYCLOAK_HOST}"
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HEALTH_ENABLED
          value: "true"
        ports:
        - containerPort: 8080
        - containerPort: 9000
        volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      volumes:
      - name: realm-import
        secret:
          secretName: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: genetics
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: keycloak
