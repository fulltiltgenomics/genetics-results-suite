# default deny all ingress in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: genetics
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# frontend: allow from load balancer (GKE health checks + external traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-frontend
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: frontend
  ingress:
  - ports:
    - port: 3000
  policyTypes:
  - Ingress
---
# bff: only auth-gateway calls it (nginx "location /api/" -> bff:5000); nothing else in the
# suite references bff. Kubelet health probes are exempt from NetworkPolicy on this cluster
# (Dataplane V2), so they need no ingress rule of their own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-bff
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: bff
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: auth-gateway
    ports:
    - port: 5000
  policyTypes:
  - Ingress
---
# results-api: the four callers admitted BY THIS RULE. auth-gateway reaches it directly through
# its @api_bearer location (programmatic bearer-token clients), bff through the browser /api/
# path, chat-backend and mcp-server through the tool executor. It is a ClusterIP service with no
# Ingress backend, so no load-balancer or health-check source needs to be admitted.
# These four are NOT the complete set of callers: the monitor CronJob is admitted by a separate,
# additive policy (allow-ingress-results-api-from-monitor in monitor-policy.yaml, same port).
# NetworkPolicies union, so that rule is load-bearing — deleting it as "already covered here"
# would lock the monitor out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-results-api
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: results-api
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: auth-gateway
    - podSelector:
        matchLabels:
          app: bff
    - podSelector:
        matchLabels:
          app: chat-backend
    - podSelector:
        matchLabels:
          app: mcp-server
    ports:
    - port: 4000
  policyTypes:
  - Ingress
---
# chat-backend: allow from load balancer
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-chat-backend
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: chat-backend
  ingress:
  - ports:
    - port: 8000
  policyTypes:
  - Ingress
---
# mcp-server: allow from load balancer
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-mcp-server
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: mcp-server
  ingress:
  - ports:
    - port: 8080
  policyTypes:
  - Ingress
---
# auth-gateway: allow from load balancer and health checks
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-auth-gateway
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: auth-gateway
  ingress:
  - ports:
    - port: 8080
  policyTypes:
  - Ingress
---
# oauth2-proxy: allow from auth-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-oauth2-proxy
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: oauth2-proxy
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: auth-gateway
    ports:
    - port: 4180
  policyTypes:
  - Ingress
---
# db-api: allow from chat-backend and mcp-server (both run the same BigQuery-backed tool executor)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-db-api
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: db-api
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: chat-backend
    - podSelector:
        matchLabels:
          app: mcp-server
    ports:
    - port: 8080
  policyTypes:
  - Ingress
---
# rag-service: only allow from mcp-server and chat-backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-rag-service
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: rag-service
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: mcp-server
    - podSelector:
        matchLabels:
          app: chat-backend
    ports:
    - port: 8000
  policyTypes:
  - Ingress
