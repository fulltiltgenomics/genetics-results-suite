# results-api: allow ingress from monitor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-results-api-from-monitor
  namespace: genetics
spec:
  podSelector:
    matchLabels:
      app: results-api
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: monitor
    ports:
    - port: 4000
  policyTypes:
  - Ingress
---
