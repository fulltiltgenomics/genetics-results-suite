# PodDisruptionBudgets for the workloads where an interrupted in-flight request is expensive.
#
# READ THIS BEFORE CHANGING maxUnavailable — especially before "fixing" it back to 0.
#
# Both deployments are replicas: 1, so with maxUnavailable: 1 the budget computes
# desiredHealthy = replicas - maxUnavailable = 1 - 1 = 0, which means disruptionsAllowed = 1
# whenever the pod is healthy. EVERY eviction is admitted immediately. These budgets therefore
# do NOT protect a running stream today. They exist to record intent and they become a real
# constraint the moment a second replica exists — at replicas: 2 the same value keeps one pod
# serving through a drain.
#
# What actually cushions a mid-stream eviction today is NOT here. It is in the Deployment
# manifests, live since commit 6db94e8: k8s/deployments/chat-backend.yaml sets
# terminationGracePeriodSeconds: 300, a preStop sleep of 10s, and uvicorn
# --timeout-graceful-shutdown 280. An evicted chat-backend pod finishes the stream it is
# serving. If you need the eviction path to be safer, change those, not this file.
#
# WHY NOT maxUnavailable: 0. It looks strictly stronger and is in practice a trap. Over a
# replicas: 1 deployment it is permanently unsatisfiable, and GKE's autoscaler has a branch for
# exactly that: "If there are Pods on a node that cannot move to other nodes in the cluster,
# cluster autoscaler does not attempt to scale down that node." The node is never even
# SELECTED for scale-down, so the documented one-hour force-termination — which applies only to
# a node already selected that then fails to drain — never comes into play. There is no time
# bound at all
# (https://cloud.google.com/kubernetes-engine/docs/concepts/cluster-autoscaler).
# Practical effect: the first rollout that puts a protected pod on a surge node ratchets the
# pool to two nodes permanently, silently reproducing the min == max == 2 pinning that was
# explicitly rejected. See "Node pool sizing" in docs/project-spec.md.
#
# Do not add a PDB here for a workload that restarts cheaply.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-backend
  namespace: genetics
spec:
  maxUnavailable: 1
  # INERT TODAY — this field is not fixing an active deadlock. At maxUnavailable: 1 over one
  # replica the budget never blocks any eviction, healthy or not, so the policy has nothing to
  # relax. It is kept because it is the correct setting for the replicas: 2 case this budget is
  # written for: under the default IfHealthyBudget a CrashLoopBackOff pod serves nothing and can
  # still block eviction-API drains (kubectl drain, surge upgrade). That blocking needs the
  # budget to be AT ITS LIMIT — at maxUnavailable: 1 that means every replica unhealthy, since
  # one unhealthy pod beside a healthy one still satisfies desiredHealthy. Switching to
  # minAvailable (or back to maxUnavailable: 0) makes ANY unhealthy pod block. Removing the
  # field leaves both of those deadlocks unguarded.
  #
  # CAVEAT for that future: "healthy" is status.conditions[type=Ready] == "True", so a pod that
  # is merely still STARTING counts as unhealthy and is freely evictable. See results-api below.
  # The field is accepted at policy/v1 on this cluster (v1.35.6-gke.1250000), verified with
  # `kubectl explain pdb.spec.unhealthyPodEvictionPolicy` and a client-side dry-run.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: chat-backend
---
# results-api holds warm in-memory indices; its startupProbe allows ~5 minutes for a cold
# start (failureThreshold: 60, periodSeconds: 5), and with replicas: 1 that is 5 minutes of
# failed tool calls for every chat turn. That is the reason a budget is declared for it — but
# as above, at replicas: 1 this budget admits every eviction, so it does not currently prevent
# that cold start. It states the intent for when a second replica exists.
#
# Note the additional hole that would remain at replicas: 2: for those same ~5 minutes the pod
# is not yet Ready, so under AlwaysAllow it stays evictable regardless of the budget. The
# guarantee would begin when the startupProbe passes, not when the pod is created — precisely
# the window the budget is justified by. AlwaysAllow is still the right choice: the alternative
# is an unbounded crashloop deadlock.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: results-api
  namespace: genetics
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: results-api
