apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: auth-gateway-hc-config
  namespace: genetics
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 10
    type: HTTP
    requestPath: /healthz
  # total RESPONSE timeout, not an idle timeout: the load balancer severs the
  # connection this long after the request starts even while bytes are still
  # streaming. At 300s it was cutting long chat turns mid-answer, which the
  # browser surfaces as "TypeError: network error". Chat SSE streams are the
  # longest-lived responses here, so this has to exceed the worst-case turn.
  timeoutSec: 1800
