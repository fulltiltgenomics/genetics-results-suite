# genetics login theme: extends the stock keycloak (v2) theme. Only federated sign-in through the
# realm's identity providers is supported, so the username/password form is hidden
# (css/genetics.css) and the social-login label is repurposed as helper text, overridden per realm
# (messages/messages_en.properties).
parent=keycloak
styles=css/styles.css css/genetics.css
